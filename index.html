const MONTH_VIEWS = ['dashboard', 'bills', 'expenses', 'income', 'payments'];

/* ------------------------------------------------------------------ UI core */
const UI = {
  view: 'dashboard',
  filters: { bills: { search: '', status: '', category: '' }, expenses: { search: '', category: '', from: '', to: '', allMonths: false }, income: { search: '', category: '', from: '', to: '', allMonths: false }, payments: { search: '', bill: '', method: '', from: '', to: '', allMonths: false }, reports: { type: 'summary', from: '', to: '' }, loans: { status: 'open', search: '', borrower: '', open: {} } },
  deferredInstall: null,

  init() {
    document.getElementById('sideNav').innerHTML = VIEWS.map(v => `<a href="#/${v.id}" data-nav="${v.id}">${svgIcon(v.id)}<span>${v.label}</span><span class="badge" data-badge="${v.id}" hidden></span></a>`).join('');
    document.getElementById('bottomNav').innerHTML = ['dashboard', 'bills', 'expenses', 'income'].map(id => `<a href="#/${id}" data-nav="${id}">${svgIcon(id, 21)}<span>${id === 'dashboard' ? 'Home' : VIEWS.find(v => v.id === id).label}</span><span class="badge" data-badge="${id}" hidden></span></a>`).join('') +
      `<button type="button" data-action="more" data-nav="more">${svgIcon('more', 21)}<span>More</span><span class="badge" data-badge="more" hidden></span></button>`;
    document.addEventListener('click', e => this.onClick(e));
    document.addEventListener('input', e => this.onInput(e));
    document.addEventListener('change', e => this.onChange(e));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') Modal.close(); });
    window.addEventListener('hashchange', () => { const v = this.hashView(); if (v && v !== this.view) this.route(v); });
    window.addEventListener('resize', U.debounce(() => Charts.drawAll(), 150));
    const mi = document.getElementById('monthInput');
    mi.addEventListener('change', () => { if (U.isYm(mi.value)) this.setMonth(mi.value); });
    Tooltip.init();
    this.go(this.view || this.hashView() || 'dashboard');
  },
  /** Reads the view from the URL hash; returns '' when the hash is unavailable (e.g. sandboxed previews). */
  hashView() {
    try { const id = (location.hash || '').replace(/^#\/?/, '').split('?')[0]; return VIEWS.some(v => v.id === id) ? id : ''; } catch (e) { return ''; }
  },
  /** Navigates without depending on the History API, so the app also works inside iframes / srcdoc previews. */
  go(view) {
    if (!VIEWS.some(v => v.id === view)) view = 'dashboard';
    this.route(view);
    try { if (location.hash !== '#/' + view) location.hash = '#/' + view; } catch (e) { /* URL not writable here — in-memory routing still works */ }
  },
  route(view) {
    const id = view || this.hashView() || this.view || 'dashboard';
    this.view = VIEWS.some(v => v.id === id) ? id : 'dashboard';
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === this.view || (a.dataset.nav === 'more' && !['dashboard', 'bills', 'expenses', 'income'].includes(this.view))));
    document.getElementById('pageTitle').textContent = VIEWS.find(v => v.id === this.view).label;
    document.getElementById('monthSel').style.visibility = MONTH_VIEWS.includes(this.view) ? 'visible' : 'hidden';
    Modal.close();
    this.render();
    document.getElementById('view').scrollTop = 0;
    window.scrollTo(0, 0);
  },
  setMonth(ym) {
    Store.month = ym;
    this.render();
    const has = Store.list('billInstances').some(i => i.billingPeriod === ym);
    if (!has && Api.configured() && navigator.onLine && U.mIdx(ym) <= U.mIdx(U.curMonth()) + 24) Sync.run({ month: ym });
  },
  render() {
    document.getElementById('monthLabel').textContent = U.monthLabel(Store.month);
    document.getElementById('monthInput').value = Store.month;
    const el = document.getElementById('view');
    const fn = Views[this.view];
    try {
      el.innerHTML = fn ? fn.call(Views) : '';
    } catch (e) {
      console.error(e);
      el.innerHTML = `<div class="banner err">Something went wrong rendering this page: ${U.esc(e.message)}</div>`;
    }
    Charts.drawAll();
    this.updateStatus();
  },
  /** Re-render after data changes without stealing focus from a filter the user is typing in. */
  refresh() {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#view .filters')) { const lb = document.getElementById('listBody'); if (lb && Views[this.view + 'List']) { lb.innerHTML = Views[this.view + 'List'](); this.updateStatus(); return; } }
    this.render();
  },
  status() {
    const pending = Store.pendingCount(), failed = Store.failedCount(), review = Store.reviewCount();
    if (Sync.running) return { state: 'syncing', text: 'Syncing…' };
    if (!navigator.onLine || Sync.reachable === false) return { state: 'offline', text: pending ? 'Offline • Saved locally' : 'Offline' };
    if (!Api.configured() || Sync.lastErrorCode === 'UNAUTHORIZED') return { state: 'pending', text: '⚠ Signed out' };
    if (failed || review) return { state: 'failed', text: review ? '⚠ Needs review' : '⚠ Sync failed' };
    if (pending) return { state: 'pending', text: '⚠ Sync pending' };
    if (Date.now() - Sync.justCompleted < 4000) return { state: 'complete', text: '✓ All changes synced' };
    return { state: 'online', text: 'Online • Synced' };
  },
  updateStatus() {
    const s = this.status();
    ['connTop', 'connSide'].forEach(id => { const el = document.getElementById(id); if (!el) return; el.dataset.state = s.state; el.querySelector('.txt').textContent = s.text; el.title = s.text + (Store.meta.lastSyncAt ? ' — last synced ' + U.fmtTime(Store.meta.lastSyncAt) : ''); });
    const n = Store.queue.length;
    document.querySelectorAll('[data-badge="sync"],[data-badge="more"]').forEach(b => { b.hidden = !n; b.textContent = n; });
    const today = U.today();
    const overdue = Calc.instances(today).filter(i => i.status === ST.OVERDUE).length;
    document.querySelectorAll('[data-badge="bills"]').forEach(b => { b.hidden = !overdue; b.textContent = overdue; });
    if (this._completeTimer) clearTimeout(this._completeTimer);
    if (s.state === 'complete') this._completeTimer = setTimeout(() => this.updateStatus(), 4100);
  },
  toast(message, kind, ms) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.innerHTML = `<span>${U.esc(message)}</span><button class="x" aria-label="Dismiss">×</button>`;
    t.querySelector('.x').onclick = () => t.remove();
    box.appendChild(t);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => t.remove(), ms || (kind === 'err' ? 7000 : 4000));
  },
  /** Disables a button, shows a label + spinner, and always restores it. */
  async busy(btn, label, fn) {
    if (btn && btn.dataset.busy === '1') return;
    const orig = btn ? btn.innerHTML : '';
    if (btn) { btn.dataset.busy = '1'; btn.disabled = true; btn.classList.add('busy'); btn.innerHTML = `<span class="spinner"></span>${U.esc(label || 'Saving…')}`; }
    try { return await fn(); }
    finally { if (btn && btn.isConnected) { btn.dataset.busy = ''; btn.disabled = false; btn.classList.remove('busy'); btn.innerHTML = orig; } }
  },
  saveOutcome(outcome, noun) {
    if (outcome === 'synced') this.toast(noun + ' saved.');
    else if (outcome === 'review') this.toast(noun + ' changed on another device too. Review it in Sync / Offline.', 'warn', 7000);
    else if (outcome === 'rejected') this.toast('Server rejected this change: ' + (Sync.lastRejection || 'invalid data') + '. See Sync / Offline.', 'err');
    else this.toast(noun + " saved locally. It will sync when you're online.");
  },
  onClick(e) {
    const link = e.target.closest('a[href^="#/"]');
    if (link) { e.preventDefault(); Modal.close(); this.go(link.getAttribute('href').slice(2)); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = Actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  },
  onInput(e) {
    const f = e.target.closest('[data-filter]');
    if (!f) return;
    const [view, key] = f.dataset.filter.split('.');
    this.filters[view][key] = f.type === 'checkbox' ? f.checked : f.value;
    const lb = document.getElementById('listBody');
    if (lb && Views[view + 'List']) lb.innerHTML = Views[view + 'List']();
  },
  onChange(e) {
    if (e.target.matches('select[data-filter], input[type=date][data-filter], input[type=checkbox][data-filter], input[type=month][data-filter]')) this.onInput(e);
  },
  cachedBanner() {
    const off = !navigator.onLine || Sync.reachable === false;
    const never = !Store.meta.lastSyncAt;
    if (!Api.configured()) {
      return `<div class="banner warn"><span class="grow"><b>Not signed in yet.</b> Entries are saved on this device and will sync after you sign in.</span><a class="btn sm" href="#/settings">Sign in</a></div>`;
    }
    if (off) return `<div class="banner"><span class="grow"><b>Showing locally cached data.</b> ${never ? 'No data has been downloaded yet.' : 'Last synced ' + U.fmtTime(Store.meta.lastSyncAt) + '.'} Changes are saved on this device and will sync automatically.</span></div>`;
    if (Sync.lastErrorCode === 'UNAUTHORIZED') return `<div class="banner warn"><span class="grow"><b>You're signed out.</b> Your changes are safe on this device and will sync after you sign in.</span><a class="btn sm" href="#/settings">Sign in</a></div>`;
    if (Sync.lastError && !Sync.running) return `<div class="banner err"><span class="grow"><b>Sync problem:</b> ${U.esc(Sync.lastError)} Showing locally cached data.</span><button class="btn sm" data-action="sync-now">Retry</button></div>`;
    return '';
  },
  options(list, selected, placeholder) {
    return (placeholder !== undefined ? `<option value="">${U.esc(placeholder)}</option>` : '') + list.map(v => { const val = typeof v === 'object' ? v.value : v; const lab = typeof v === 'object' ? v.label : v; return `<option value="${U.esc(val)}" ${String(val) === String(selected) ? 'selected' : ''}>${U.esc(lab)}</option>`; }).join('');
  }
};

const tagFor = st => `<span class="tag ${st === 'OVER BUDGET' ? 'OVER' : U.esc(st)}">${U.esc(st)}</span>`;
const localTag = r => r && r.syncStatus && r.syncStatus !== 'synced' ? `<span class="tag local" title="${U.esc(r.syncError || 'Not yet synced to Google Sheets')}">${r.syncStatus === 'failed' ? 'Sync failed' : r.syncStatus === 'conflict' ? 'Needs review' : 'Saved locally'}</span>` : '';

/* ------------------------------------------------------------------ Tooltip */
const Tooltip = {
  el: null, hideTimer: null,
  init() {
    this.el = document.getElementById('tooltip');
    document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) this.show(t.dataset.tip, e); });
    document.addEventListener('mousemove', e => { if (this.el.classList.contains('show')) this.place(e); });
    document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) this.hide(); });
    document.addEventListener('touchstart', e => { const t = e.target.closest('[data-tip]'); if (t) { const p = e.touches[0]; this.show(t.dataset.tip, p); clearTimeout(this.hideTimer); this.hideTimer = setTimeout(() => this.hide(), 2500); } }, { passive: true });
  },
  show(text, e) { this.el.textContent = text; this.el.classList.add('show'); this.place(e); },
  place(e) {
    const w = this.el.offsetWidth, h = this.el.offsetHeight;
    let x = e.clientX + 14, y = e.clientY - h - 12;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y < 8) y = e.clientY + 18;
    this.el.style.left = Math.max(8, x) + 'px'; this.el.style.top = y + 'px';
  },
  hide() { this.el.classList.remove('show'); }
};

/* ------------------------------------------------------------------ Charts (hand-built SVG, sized to the container) */
const Charts = {
  pending: {},
  css: v => getComputedStyle(document.documentElement).getPropertyValue(v).trim(),
  drawAll() {
    document.querySelectorAll('[data-chart]').forEach(el => {
      const spec = this.pending[el.dataset.chart];
      if (!spec) return;
      const w = Math.max(260, el.clientWidth - (parseFloat(getComputedStyle(el).paddingLeft) + parseFloat(getComputedStyle(el).paddingRight)));
      try { el.innerHTML = spec.draw(w); } catch (e) { el.innerHTML = '<div class="empty">Chart unavailable</div>'; console.error(e); }
    });
  },
  register(id, draw) { this.pending[id] = { draw }; return `<div class="chart" data-chart="${id}"></div>`; },
  niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; },
  compact(v) { if (Math.abs(v) >= 1e6) return '₱' + U.round2(v / 1e6) + 'M'; if (Math.abs(v) >= 1000) return '₱' + Math.round(v / 100) / 10 + 'k'; return '₱' + Math.round(v); },
  trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; },
  empty(msg) { return `<div class="empty" style="padding:28px 0">${U.esc(msg)}</div>`; },

  expectedVsActual(rows) {
    return w => {
      if (!rows.length) return this.empty('No bills for this month.');
      const labelW = Math.min(130, w * 0.32), valW = 74, plotW = w - labelW - valW, rowH = 34;
      const max = this.niceMax(Math.max(...rows.map(r => Math.max(r.expected, r.actual))));
      const h = rows.length * rowH + 8;
      const ce = this.css('--c-expected'), ca = this.css('--c-actual');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Expected versus actual spending by bill">`;
      rows.forEach((r, i) => {
        const y = i * rowH + 4;
        const we = Math.max(r.expected > 0 ? 2 : 0, r.expected / max * plotW), wa = Math.max(r.actual > 0 ? 2 : 0, r.actual / max * plotW);
        const tip = `${r.name}\nExpected ${U.peso(r.expected)}\nActual ${r.actual ? U.peso(r.actual) : '— (not paid)'}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="0" y="${y - 2}" width="${w}" height="${rowH - 2}" fill="transparent"/>`;
        s += `<text x="0" y="${y + 17}" style="font-weight:600;fill:${this.css('--ink')}">${U.esc(this.trunc(r.name, Math.floor(labelW / 7)))}</text>`;
        s += `<rect x="${labelW}" y="${y + 3}" width="${we}" height="9" rx="3" fill="${ce}"/>`;
        s += `<rect x="${labelW}" y="${y + 15}" width="${wa}" height="9" rx="3" fill="${ca}"/>`;
        s += `<text x="${w}" y="${y + 23}" text-anchor="end" style="font-variant-numeric:tabular-nums">${r.actual ? U.peso(r.actual, true) : '—'}</text></g>`;
      });
      return s + '</svg>';
    };
  },
  incomeVsOut(trend) {
    return w => {
      const h = 220, padL = 52, padB = 26, padT = 10, plotW = w - padL - 4, plotH = h - padB - padT;
      const max = this.niceMax(Math.max(1, ...trend.map(t => Math.max(t.actualIncome, t.totalSpent))));
      const ci = this.css('--c-income'), co = this.css('--c-out');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Income versus money out, last six months">`;
      for (let k = 0; k <= 4; k++) {
        const y = padT + plotH - plotH * k / 4;
        s += `<line class="grid" x1="${padL}" x2="${w}" y1="${y}" y2="${y}"/><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${this.compact(max * k / 4)}</text>`;
      }
      const group = plotW / trend.length, bw = Math.min(22, (group - 14) / 2);
      trend.forEach((t, i) => {
        const cx = padL + group * i + group / 2;
        const hi = t.actualIncome / max * plotH, ho = t.totalSpent / max * plotH;
        const tip = `${U.monthLabel(t.month)}\nIncome received ${U.peso(t.actualIncome)}\nMoney out ${U.peso(t.totalSpent)}\nNet ${U.peso(t.actualIncome - t.totalSpent)}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="${cx - group / 2}" y="${padT}" width="${group}" height="${plotH}" fill="transparent"/>`;
        s += `<rect x="${cx - bw - 1}" y="${padT + plotH - hi}" width="${bw}" height="${Math.max(0, hi)}" rx="3" fill="${ci}"/>`;
        s += `<rect x="${cx + 1}" y="${padT + plotH - ho}" width="${bw}" height="${Math.max(0, ho)}" rx="3" fill="${co}"/>`;
        s += `<text x="${cx}" y="${h - 8}" text-anchor="middle" style="${t.month === Store.month ? 'font-weight:700;fill:' + this.css('--ink') : ''}">${U.monthShort(t.month)}</text></g>`;
      });
      s += `<line class="axis" x1="${padL}" x2="${w}" y1="${padT + plotH}" y2="${padT + plotH}"/>`;
      return s + '</svg>';
    };
  },
  categories(rows) {
    return w => {
      if (!rows.length) return this.empty('No spending recorded this month yet.');
      let list = rows.slice(0, 7);
      if (rows.length > 7) list.push({ category: 'All other', amount: rows.slice(7).reduce((a, b) => a + b.amount, 0) });
      const total = rows.reduce((a, b) => a + b.amount, 0);
      const labelW = Math.min(120, w * 0.3), valW = 92, plotW = w - labelW - valW, rowH = 28;
      const max = Math.max(...list.map(r => r.amount));
      const h = list.length * rowH;
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Spending by category">`;
      list.forEach((r, i) => {
        const y = i * rowH;
        const bw = Math.max(2, r.amount / max * plotW);
        s += `<g data-tip="${U.esc(r.category + '\n' + U.peso(r.amount) + ' · ' + Math.round(r.amount / total * 100) + '% of spending')}"><rect x="0" y="${y}" width="${w}" height="${rowH}" fill="transparent"/>`;
        s += `<text x="0" y="${y + 17}">${U.esc(this.trunc(r.category, Math.floor(labelW / 6.5)))}</text>`;
        s += `<rect x="${labelW}" y="${y + 8}" width="${bw}" height="11" rx="3" fill="${this.css('--ink')}"/>`;
        s += `<text x="${w}" y="${y + 17}" text-anchor="end" style="font-variant-numeric:tabular-nums;fill:${this.css('--ink')}">${U.peso(r.amount, true)}</text></g>`;
      });
      return s + '</svg>';
    };
  },
  savings(rows) {
    return w => {
      if (!rows.length) return this.empty('No months to show yet.');
      const h = 230, padL = 56, padB = 26, padT = 18, plotW = w - padL - 4, plotH = h - padB - padT;
      const vals = rows.map(r => r.saved);
      const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
      const step = this.niceMax(Math.max(1, (hi - lo) / 4));
      const top = Math.max(step, Math.ceil(hi / step) * step), bottom = Math.floor(lo / step) * step;
      const range = top - bottom || 1;
      const y = v => padT + (top - v) / range * plotH;
      const fmt = v => (v < 0 ? '−' : '') + this.compact(Math.abs(v));
      const cPos = this.css('--c-income'), cNeg = this.css('--c-out');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Money saved per month">`;
      for (let v = bottom; v <= top + 0.5; v += step) { s += `<line class="grid" x1="${padL}" x2="${w}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
      const group = plotW / rows.length, bw = Math.max(6, Math.min(34, group - 10));
      rows.forEach((r, i) => {
        const cx = padL + group * i + group / 2;
        const y0 = y(0), y1 = y(r.saved);
        const tip = `${U.monthLabel(r.month)}${r.partial ? ' (so far)' : ''}\nSaved ${U.peso(r.saved)}\nIncome ${U.peso(r.income)} · Out ${U.peso(r.out)}${r.rate === null ? '' : '\nSavings rate ' + Math.round(r.rate * 100) + '%'}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="${cx - group / 2}" y="${padT}" width="${group}" height="${plotH}" fill="transparent"/>`;
        s += `<rect x="${cx - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="3" fill="${r.saved >= 0 ? cPos : cNeg}" ${r.partial ? 'opacity=".55"' : ''}/>`;
        if (rows.length <= 12 && group > 44) s += `<text x="${cx}" y="${r.saved >= 0 ? y1 - 5 : y1 + 13}" text-anchor="middle" style="font-variant-numeric:tabular-nums;fill:${this.css('--ink')};font-weight:600">${fmt(r.saved)}</text>`;
        s += `<text x="${cx}" y="${h - 8}" text-anchor="middle">${U.monthShort(r.month)}</text></g>`;
      });
      s += `<line class="axis" x1="${padL}" x2="${w}" y1="${y(0)}" y2="${y(0)}"/>`;
      return s + '</svg>';
    };
  },
  status(counts) {
    const order = [['PAID', '--paid', 'Paid'], ['PARTIAL', '--partial', 'Partial'], ['UNPAID', '--unpaid', 'Unpaid'], ['OVERDUE', '--overdue', 'Overdue'], ['OVER BUDGET', '--over', 'Over budget']];
    return w => {
      const total = order.reduce((a, o) => a + (counts[o[0]] || 0), 0);
      if (!total) return this.empty('No bills for this month.');
      const h = 22; let x = 0;
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bill payment status">`;
      const segs = order.filter(o => counts[o[0]]);
      const gaps = (segs.length - 1) * 2, avail = w - gaps;
      segs.forEach((o, i) => {
        const sw = counts[o[0]] / total * avail;
        s += `<rect data-tip="${U.esc(o[2] + ': ' + counts[o[0]] + ' bill' + (counts[o[0]] > 1 ? 's' : ''))}" x="${x}" y="0" width="${Math.max(1, sw)}" height="${h}" rx="4" fill="${this.css(o[1])}"/>`;
        x += sw + 2;
      });
      s += '</svg>';
      s += `<div class="legend" style="padding:14px 0 0">${order.map(o => `<span><i style="background:var(${o[1]})"></i>${o[2]} <b>${counts[o[0]] || 0}</b></span>`).join('')}</div>`;
      return s;
    };
  }
};

/* ------------------------------------------------------------------ Views */
const Views = {
  /* ============================== DASHBOARD ============================== */
  dashboard() {
    const today = U.today();
    const inst = Calc.instances(today);
    const s = Calc.summary(Store.month, inst, today);
    const b = s.budget;
    const scheduled = inst.filter(i => i.billingPeriod === Store.month && !i.isVoid).length;
    const unpaidN = s.counts.UNPAID + s.counts.PARTIAL + s.counts.OVERDUE;
    const incomePct = s.expectedIncome > 0 ? Math.round(s.actualIncome / s.expectedIncome * 100) : null;
    const v = Store.verified && Store.verified[Store.month];
    const verify = !Api.configured() ? '' : v ? (v.ok ? `<span class="eyebrow" style="color:var(--paid)">✓ Totals verified with Google Sheets · ${U.fmtTime(v.at)}</span>` : `<span class="eyebrow" style="color:var(--partial)">⚠ Local totals differ from the server — refreshing</span>`) : '';
    const kpi = (label, value, meta, cls, tone) => `<div class="card kpi ${cls || ''}">${tone ? `<span class="tone" style="background:var(${tone})"></span>` : ''}<div class="label">${label}</div><div class="value ${value < 0 && !cls ? 'neg' : ''}" title="${U.esc(U.peso(value))}">${U.peso(value, true)}</div><div class="meta">${meta}</div></div>`;
    Charts.pending = {};
    const healthCls = b.health === 'ON TRACK' ? 'ON' : b.health === 'WATCH' ? 'WATCH' : 'OVER';
    const pct = Math.min(100, Math.max(0, b.percentUsed));
    const proj = Math.min(100, Math.max(0, b.percentProjected));
    const upcoming = Calc.upcoming(Store.month, inst, today);
    const attention = Calc.attention(Store.month, inst, today);
    const trend = U.monthRange(U.addMonths(Store.month, -5), Store.month).map(m => { const x = Calc.summary(m, inst, today); return { month: m, actualIncome: x.actualIncome, totalSpent: x.totalSpent }; });
    const miniRow = i => `<div class="row cols-mini">
        <div class="primary-cell"><div class="name">${U.esc(i.billName)} ${localTag(i.hasLocal ? { syncStatus: 'pending' } : null)}</div><div class="sub">${i.status === ST.OVERDUE ? '<span class="neg">Overdue · </span>' : ''}${U.esc(Calc.datesText(i))}${i.paymentCount ? ' · paid ' + U.peso(i.actualAmount, true) : ''}</div></div>
        <div class="num"><b>${U.peso(i.status === ST.OVER ? i.actualAmount : Math.max(0, i.remainingAmount))}</b><div>${tagFor(i.status)}</div></div>
        <div class="actions">${i.status === ST.PAID || i.status === ST.OVER ? `<button class="btn sm" data-action="bill-details" data-id="${U.esc(i.billInstanceId)}">Details</button>` : `<button class="btn sm pay" data-action="pay" data-id="${U.esc(i.billInstanceId)}">${i.paymentCount ? 'Pay balance' : 'Mark as Paid'}</button>`}</div>
      </div>`;
    return `
      <div class="hero">
        <div><div class="eyebrow">${U.esc(U.monthLabel(Store.month))}</div><h2>Household Finances</h2><div class="sub">Budget &amp; Bill Monitoring</div></div>
        <div class="hero-actions no-print">
          <button class="btn" data-action="add-income">${svgIcon('plus', 16)} Add income</button>
          <button class="btn primary" data-action="add-expense">${svgIcon('plus', 16)} Add expense</button>
        </div>
      </div>
      ${UI.cachedBanner()}
      ${verify ? `<div style="margin:-6px 0 14px">${verify}</div>` : ''}
      ${this.insightCard()}
      <div class="kpis">
        ${kpi('Monthly Budget', s.monthlyBudget, `${s.budgetSource === 'month' ? 'Planned for ' + U.monthLabel(Store.month) : 'Default budget'} · <a href="#" data-action="edit-budget" style="color:inherit">Adjust</a>`, 'lead')}
        ${kpi('Expected', s.expectedBills, `${scheduled} bill${scheduled === 1 ? '' : 's'} scheduled this month`)}
        ${kpi('Actual', s.totalSpent, `Bills ${U.peso(s.actualBills, true)} · Other ${U.peso(s.otherExpenses, true)}`)}
        ${kpi('Remaining', s.remaining, s.remaining < 0 ? 'Over the planned budget' : 'Budget left after spending', '', s.remaining < 0 ? '--overdue' : '--paid')}
        ${kpi('Unpaid', s.unpaidAmount, `${unpaidN} open · ${s.counts.OVERDUE} overdue`, '', s.counts.OVERDUE ? '--overdue' : '')}
        ${kpi('Over Budget', s.overBudgetAmount, `${s.counts['OVER BUDGET']} bill${s.counts['OVER BUDGET'] === 1 ? '' : 's'} above expected`, '', s.overBudgetAmount > 0 ? '--over' : '')}
        ${kpi('Expected Income', s.expectedIncome, 'Planned for this month')}
        ${kpi('Actual Income', s.actualIncome, incomePct === null ? 'Received this month' : incomePct + '% of expected received')}
        ${kpi('Net Cash Flow', s.netCashFlow, 'Income − bills − other expenses', '', s.netCashFlow < 0 ? '--overdue' : '--paid')}
      </div>

      <div class="grid-3-1">
        <div class="card">
          <div class="card-head"><h3 class="card-title">Budget Health</h3><span class="health ${healthCls}">${U.esc(b.health)}</span></div>
          <div class="card-pad" style="padding-top:8px">
            <div class="meter" aria-label="Budget used ${Math.round(b.percentUsed)}%"><div class="fill" style="width:${pct}%"></div>${b.basis > 0 ? `<div class="proj" style="left:${proj}%" data-tip="Projected if every scheduled bill is paid: ${U.esc(U.peso(b.projectedSpend))}"></div>` : ''}</div>
            <div class="meter-legend"><span><b>${U.peso(b.totalSpent, true)}</b> spent · ${Math.round(b.percentUsed)}% of ${U.peso(b.basis, true)}</span><span><span style="display:inline-block;width:10px;height:2px;background:var(--gold);vertical-align:middle"></span> Projected ${U.peso(b.projectedSpend, true)}</span></div>
            ${b.reasons.length ? `<ul class="reasons">${b.reasons.map(r => `<li>${U.esc(r)}</li>`).join('')}</ul>` : `<p class="sub" style="color:var(--ink-2);margin:14px 0 0">Spending, projected bills and income are all within plan for ${U.esc(U.monthLabel(Store.month))}.</p>`}
            <div style="margin-top:22px"><div class="card-title" style="margin-bottom:10px">Bill Payment Status</div>${Charts.register('status', Charts.status(s.counts))}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3 class="card-title">Bills Requiring Attention</h3><a class="btn sm ghost" href="#/bills">All bills</a></div>
          <div class="list" style="margin-top:8px">${attention.length ? attention.slice(0, 8).map(miniRow).join('') + (attention.length > 8 ? `<div class="list-foot"><span>+${attention.length - 8} more</span><a href="#/bills">View all bills</a></div>` : '') : '<div class="empty">Nothing needs attention right now.</div>'}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3 class="card-title">Upcoming Bills</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">${Store.month === today.slice(0, 7) ? 'Next 30 days' : U.esc(U.monthLabel(Store.month))}</span></div>
          <div class="list" style="margin-top:8px">${upcoming.length ? upcoming.slice(0, 8).map(miniRow).join('') + (upcoming.length > 8 ? `<div class="list-foot"><span>+${upcoming.length - 8} more</span><a href="#/bills">View all bills</a></div>` : '') : '<div class="empty">No upcoming unpaid bills.</div>'}</div>
        </div>
        <div class="card">
          <div class="card-head"><h3 class="card-title">Spending by Category</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">Bills paid + other expenses</span></div>
          ${Charts.register('cat', Charts.categories(s.byCategory))}
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3 class="card-title">Expected vs Actual Spending</h3></div>
          <div class="legend"><span><i style="background:var(--c-expected)"></i>Expected</span><span><i style="background:var(--c-actual)"></i>Actual paid</span></div>
          ${Charts.register('eva', Charts.expectedVsActual(s.byBill))}
        </div>
        <div class="card">
          <div class="card-head"><h3 class="card-title">Income vs Expenses</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">Last 6 months</span></div>
          <div class="legend"><span><i style="background:var(--c-income)"></i>Income received</span><span><i style="background:var(--c-out)"></i>Money out (bills + expenses)</span></div>
          ${Charts.register('ivo', Charts.incomeVsOut(trend))}
        </div>
      </div>`;
  },

  /* Household Financial Status — Smart Financial Insight (rule-based; see FinancialInsight). */
  insightCard() {
    const r = Calc.insight(Store.month);
    const label = { COMFORTABLE: 'Comfortable', STABLE: 'Stable', CAUTION: 'Caution', WARNING: 'Warning', CRITICAL: 'Critical' }[r.status];
    const P = v => U.peso(v, true);
    const tile = (lab, val, note, cls) => `<div class="ins-tile"><div class="t-label">${lab}</div><div class="t-value ${cls || ''}">${val}</div>${note ? `<div class="t-note">${note}</div>` : ''}</div>`;
    const short = r.safeToSpend < 0;
    const icon = { loanOverdue: '↺', loanDue: '↺', overdue: '!', crunch: '!', largeBill: '₱', lateIncome: '↓', overBudget: '%', projectedOver: '%', lowRoom: '·', unpaid: '#', billAbove: '+', category: '+', plan: 'i', healthy: '✓' };
    const monthWord = r.mode === 'current' ? 'this month' : U.monthLabel(Store.month);
    const incomeRows = (r.lateIncomeItems || []).map(x => Object.assign({ late: true }, x)).concat(r.incomeToCome || []).slice(0, 3);
    const formula = r.mode === 'past' ? `Income ${P(r.actualIncome)} − bills paid ${P(r.paidBills)} − other expenses ${P(r.otherExpenses)}` :
      `${r.mode === 'current' ? 'On hand ' + P(r.available) + ' + still coming ' : 'Expected income '}${P(r.incomeStillComing)} − unpaid bills ${P(r.remainingBills)}${r.plannedExpenses ? ' − everyday spending ' + P(r.plannedExpenses) : ''} − buffer ${P(r.safetyBuffer)}`;
    return `<section class="card insight st-${r.status}" aria-label="Household financial status">
      <div class="ins-top"><div class="eyebrow">Household Financial Status · ${U.esc(U.monthLabel(Store.month))}</div><span class="ins-pill"><i></i>${label}</span></div>
      <div class="ins-body">
        <div class="ins-main">
          <h2 class="ins-headline">${U.esc(r.headline)}</h2>
          <p class="ins-comment">${U.esc(r.comment)}</p>
          <div class="ins-grid">
            ${tile('Expected income', P(r.expectedIncome), r.pendingIncome ? P(r.pendingIncome) + ' not received yet' : 'all received')}
            ${tile('Actual income received', P(r.actualIncome), r.lateIncome ? '<span class="neg">' + P(r.lateIncome) + ' late</span>' : '')}
            ${tile('Recurring bills', P(r.recurringBills), monthWord)}
            ${tile('Remaining bills', P(r.remainingBills), r.overdueCount ? '<span class="neg">' + r.overdueCount + ' overdue</span>' : (r.carriedOverdue ? 'incl. older bills' : 'still to pay'), r.remainingBills > 0 ? '' : 'pos')}
            ${tile('Paid bills', P(r.paidBills), r.recurringBills ? Math.round(r.paidBills / r.recurringBills * 100) + '% of bills' : '')}
            ${tile('Other expenses', P(r.otherExpenses), r.mode === 'current' && r.plannedExpenses ? '~' + P(r.plannedExpenses) + ' more expected' : '')}
            ${tile('Budget remaining', P(r.budgetRemaining), r.budget ? r.budgetUsedPercent + '% of ' + P(r.budget) + ' used' : 'no budget set', r.budgetRemaining < 0 ? 'neg' : '')}
            ${tile(r.mode === 'current' ? 'Days left' : 'Cash on hand', r.mode === 'current' ? String(r.daysLeft) : P(r.cashOnHand), r.mode === 'current' ? (r.nextIncome ? 'next income ' + U.esc(U.fmtDate(r.nextIncome.date).replace(/, \d{4}$/, '')) : 'in ' + U.esc(U.monthLabel(Store.month).split(' ')[0])) : 'today')}
          </div>
        </div>
        <aside class="ins-side">
          <div class="ins-safe">
            <div class="s-label">Safe to spend${r.mode === 'future' ? ' (planned)' : r.mode === 'past' ? ' — month result' : ''}</div>
            <div class="s-big ${short ? 'is-short' : ''}" title="${U.esc(U.peso(r.safeToSpend))}">${short ? '₱0' : P(r.safeToSpend)}</div>
            ${short ? `<div class="s-short">${r.mode === 'past' ? 'Overspent' : 'Short'} by ${P(-r.safeToSpend)} — hold off on extra spending</div>` : ''}
            <div class="s-formula">${U.esc(formula)}</div>
          </div>
          ${r.reminders.length ? `<ul class="ins-rem">${r.reminders.slice(0, 3).map(x => `<li class="rm-${U.esc(x.type)}"><span class="rm-ic" aria-hidden="true">${icon[x.type] || '·'}</span><span><b>${x.type === 'healthy' ? '' : 'Reminder: '}</b>${U.esc(x.text)}</span></li>`).join('')}</ul>` : ''}
          ${r.upcomingBills.length ? `<div class="ins-list"><div class="t-label">${r.mode === 'past' ? 'Still unpaid' : 'Biggest bills coming up'}</div>${(r.majorBills.length ? r.majorBills.map(m => Object.assign({ status: (r.upcomingBills.find(u => u.billInstanceId === m.billInstanceId) || {}).status }, m)) : r.upcomingBills.slice(0, 3)).map(b => `<div class="ins-li"><span><b>${U.esc(b.name)}</b> <span class="sub">${b.status === 'OVERDUE' ? '<span class="neg">overdue · </span>' : ''}${U.esc(U.fmtDay(b.dueDate))}</span></span><span class="num">${P(b.amount)}</span>${b.billInstanceId ? `<button class="btn sm" data-action="pay" data-id="${U.esc(b.billInstanceId)}">Pay</button>` : ''}</div>`).join('')}</div>` : ''}
          ${incomeRows.length && r.mode !== 'past' ? `<div class="ins-list"><div class="t-label">Income to record</div>${incomeRows.map(x => `<div class="ins-li"><span><b>${U.esc(x.source)}</b> <span class="sub">${x.late ? '<span class="neg">expected </span>' : ''}${U.esc(U.fmtDay(x.date))}</span></span><span class="num">${P(x.expectedAmount)}</span><button class="btn sm ${x.late ? 'pay' : ''}" data-action="receive-income" data-id="${U.esc(x.incomeId)}">Received</button></div>`).join('')}</div>` : ''}
        </aside>
      </div>
      <div class="ins-foot">Smart Financial Insight · calculated from your own records with fixed household-finance rules (no AI) · updates with every change${Number(Store.settings.openingBalance || 0) ? '' : ' · <a href="#" data-action="edit-opening-balance">Set your starting balance</a> for an accurate cash figure'}</div>
    </section>`;
  },
  availablePanel() {
    const today = U.today();
    const a = Calc.available(today);
    const neg = a.safeToSpend < 0;
    const incRow = (r, late) => `<div class="row cols-mini" style="padding:10px 0">
        <div class="primary-cell"><div class="name">${U.esc(r.source)}</div><div class="sub">${late ? '<span class="neg">Expected ' + U.esc(U.fmtDay(r.date)) + ' · not marked received</span>' : U.esc(U.fmtDay(r.date))}</div></div>
        <div class="num"><b>${U.peso(r.expectedAmount, true)}</b></div>
        <div class="actions"><button class="btn sm ${late ? 'pay' : ''}" data-action="receive-income" data-id="${U.esc(r.incomeId || r.id)}">Received</button></div></div>`;
    const noBalance = !Number(Store.settings.openingBalance || 0) && !Store.settings.openingBalanceConfirmed;
    return `<div class="card avail">
      <div class="avail-main">
        <div class="label">Safe to spend <span style="opacity:.7">· as of ${U.esc(U.fmtDay(today))}</span></div>
        <div class="big ${neg ? 'neg-light' : ''}" title="${U.esc(U.peso(a.safeToSpend))}">${U.peso(a.safeToSpend, true)}</div>
        <div class="meta">Cash on hand <b>${U.peso(a.cashOnHand, true)}</b>${a.committedBeforeNextIncome > 0 ? ` − <b>${U.peso(a.committedBeforeNextIncome, true)}</b> for ${a.billsBefore.length} bill${a.billsBefore.length === 1 ? '' : 's'} due ${a.nextIncome ? 'before ' + U.esc(U.fmtDay(a.nextIncome.date)) : 'in the next 31 days'}` : ' · no unpaid bills due before the next income'}</div>
        <div class="meta" style="margin-top:10px;opacity:.85">${a.nextIncome ? `Next income: <b>${U.esc(a.nextIncome.source)}</b> · ${U.peso(a.nextIncome.expectedAmount, true)} on ${U.esc(U.fmtDay(a.nextIncome.date))}` : 'No upcoming income scheduled.'}</div>
        ${noBalance ? `<button class="btn sm" style="margin-top:14px;background:transparent;color:#F7F4EF;border-color:rgba(255,255,255,.35)" data-action="edit-opening-balance">Set your starting balance</button>` : `<div class="meta" style="margin-top:6px;opacity:.65">Starting balance ${U.peso(a.openingBalance, true)}${a.openingBalanceDate ? ' on ' + U.esc(U.fmtDate(a.openingBalanceDate)) : ''} · received ${U.peso(a.incomeReceived, true)} · paid out ${U.peso(a.billsPaid + a.otherExpenses, true)}</div>`}
      </div>
      <div class="avail-side">
        <div class="card-title" style="margin-bottom:4px">Income</div>
        <div class="list">${a.lateIncome.slice(0, 3).map(r => incRow(r, true)).join('')}${a.upcomingIncome.slice(0, 4).map(r => incRow(r, false)).join('') || (a.lateIncome.length ? '' : '<div class="empty" style="padding:18px 0">No expected income. Add one under Income.</div>')}</div>
        <a class="btn sm ghost" href="#/income" style="margin-top:6px">All income</a>
      </div>
    </div>`;
  },
  recurringIncomeCard() {
    const list = Store.list('recurringIncome').sort((a, b) => (U.bool(b.isActive) - U.bool(a.isActive)) || String(a.source).localeCompare(b.source));
    if (!list.length) return `<div class="card card-pad" style="margin-bottom:18px"><div class="card-title" style="margin-bottom:6px">Recurring income</div><p class="sub" style="color:var(--ink-2);margin:0">No schedules yet. Add one and its expected payments appear automatically every month.</p></div>`;
    const monthly = list.filter(r => U.bool(r.isActive)).reduce((a, r) => a + Math.round(Calc.monthlyEquivalent(r) * 100), 0);
    return `<div class="card" style="margin-bottom:18px"><div class="card-head"><h3 class="card-title">Recurring income</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">≈ ${U.peso(U.fromCents(monthly), true)} / month</span></div>
      <div class="list" style="margin-top:8px">${list.map(r => `<div class="row cols-rec ${U.bool(r.isActive) ? '' : 'dim'}">
        <div class="primary-cell"><div class="name">${U.esc(r.source)} ${localTag(r)}</div><div class="sub">${U.esc(r.category)} · ${U.esc(r.paymentMethod)}</div></div>
        <div class="num" data-label="Expected"><b>${U.peso(r.amount)}</b></div>
        <div data-label="Schedule">${U.esc(Calc.scheduleText(r))}${r.weekendRule && r.weekendRule !== 'NONE' ? '<div class="sub">' + U.esc((WEEKEND_RULES.find(w => w.value === r.weekendRule) || {}).label || '') + '</div>' : ''}</div>
        <div data-label="Method">${U.esc(r.paymentMethod)}</div>
        <div class="status-cell">${U.bool(r.isActive) ? '<span class="tag PAID">ACTIVE</span>' : '<span class="tag VOID">PAUSED</span>'}</div>
        <div class="actions"><button class="btn sm" data-action="edit-recurring-income" data-id="${U.esc(r.id)}">Edit</button>${U.bool(r.isActive) ? `<button class="btn sm danger" data-action="toggle-recurring-income" data-id="${U.esc(r.id)}" data-on="0">Pause</button>` : `<button class="btn sm" data-action="toggle-recurring-income" data-id="${U.esc(r.id)}" data-on="1">Resume</button>`}</div>
      </div>`).join('')}</div></div>`;
  },

  /* ============================== LENT MONEY ============================== */
  loans() {
    const f = UI.filters.loans;
    const t = Calc.loanTotals();
    const counts = { open: 0, OVERDUE: 0, REPAID: 0, 'WRITTEN OFF': 0, all: t.list.length };
    t.list.forEach(l => { if (l.status !== 'REPAID' && l.status !== 'WRITTEN OFF') counts.open++; if (counts[l.status] !== undefined) counts[l.status]++; });
    const people = {};
    t.list.filter(l => l.status !== 'REPAID' && l.status !== 'WRITTEN OFF').forEach(l => {
      const k = l.borrower.trim(); people[k] = people[k] || { name: k, lent: 0, repaid: 0, left: 0, overdue: false };
      people[k].lent += U.cents(l.amount); people[k].repaid += U.cents(l.repaidAmount); people[k].left += U.cents(l.remainingAmount); if (l.status === 'OVERDUE') people[k].overdue = true;
    });
    const owe = Object.values(people).sort((a, b) => b.left - a.left);
    const maxLent = Math.max(1, ...owe.map(p => p.lent));
    const stat = (cls, label, value, meta) => `<div class="loan-stat ${cls}"><div class="label">${label}</div><div class="value">${value}</div><div class="meta">${meta}</div></div>`;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Lent Money</h2><span class="sub" style="color:var(--muted)">Money you lent to other people</span></div><button class="btn primary" data-action="add-loan">${svgIcon('plus', 16)} Lend money</button></div>
      <div class="loan-stats">
        ${stat('ls-owed', 'Owed to you', U.peso(t.owed, true), t.openCount ? `${t.openCount} open loan${t.openCount === 1 ? '' : 's'}` : 'Nobody owes you right now')}
        ${stat('ls-lent', 'Lent this month', U.peso(t.lentThisMonth, true), 'Leaves your cash on hand')}
        ${stat('ls-back', 'Repaid this month', U.peso(t.repaidThisMonth, true), 'Back in your cash on hand')}
        ${stat('ls-late', 'Past due', String(t.overdue.length), t.overdue.length ? U.peso(t.overdue.reduce((a, l) => a + l.remainingAmount, 0), true) + ' to follow up' : 'Everyone is on time')}
      </div>
      ${owe.length ? `<div class="card owe-card"><div class="card-head"><h3 class="card-title">Who owes you</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">Tap a name to see their loans</span></div>
        <div class="owe-list">${owe.map(p => `<button class="owe-row ${f.borrower === p.name ? 'on' : ''}" data-action="loan-borrower" data-name="${U.esc(p.name)}" data-tip="${U.esc(p.name + '\nLent ' + U.peso(U.fromCents(p.lent)) + '\nRepaid ' + U.peso(U.fromCents(p.repaid)) + '\nStill owes ' + U.peso(U.fromCents(p.left)))}">
            <span class="avatar sm" style="--av:${avatarColor(p.name)}">${U.esc(initials(p.name))}</span>
            <span class="owe-name">${U.esc(p.name)}${p.overdue ? ' <span class="late-dot" title="Past due"></span>' : ''}</span>
            <span class="owe-bar" style="--w:${(p.lent / maxLent * 100).toFixed(1)}%"><i class="paid" style="--p:${(p.repaid / p.lent * 100).toFixed(1)}%"></i><i class="left" style="--av:${avatarColor(p.name)};--p:${(p.left / p.lent * 100).toFixed(1)}%"></i></span>
            <span class="owe-amt">${U.peso(U.fromCents(p.left), true)}</span></button>`).join('')}</div>
        <div class="legend" style="padding:4px 24px 18px"><span><i style="background:var(--paid)"></i>Repaid</span><span><i style="background:linear-gradient(90deg,#2470A8,#C0643A,#7B4B94)"></i>Still owed (each person's color)</span></div></div>` : ''}
      <div class="chips" style="margin-top:18px">${[['open', 'Still owed'], ['OVERDUE', 'Past due'], ['REPAID', 'Repaid'], ['WRITTEN OFF', 'Written off'], ['all', 'All']].map(c => `<button class="chip ${f.status === c[0] ? 'on' : ''}" data-action="loan-chip" data-status="${c[0]}">${c[1]} <b>${counts[c[0]]}</b></button>`).join('')}
        ${f.borrower ? `<button class="chip on" data-action="loan-borrower" data-name="${U.esc(f.borrower)}">${U.esc(f.borrower)} ×</button>` : ''}</div>
      <div class="filters" style="margin-bottom:14px"><div class="field grow"><label for="flS">Search</label><input id="flS" class="input" type="search" placeholder="Name or note" value="${U.esc(f.search)}" data-filter="loans.search"></div></div>
      <div id="listBody">${this.loansList()}</div>`;
  },
  loansList() {
    const f = UI.filters.loans, q = f.search.trim().toLowerCase();
    const list = Calc.loans().filter(l => (f.status === 'all' || (f.status === 'open' ? (l.status !== 'REPAID' && l.status !== 'WRITTEN OFF') : l.status === f.status)) &&
      (!f.borrower || l.borrower.trim() === f.borrower) && (!q || [l.borrower, l.notes].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => ({ OVERDUE: 0, PARTIAL: 1, OUTSTANDING: 1, REPAID: 3, 'WRITTEN OFF': 4 }[a.status] - { OVERDUE: 0, PARTIAL: 1, OUTSTANDING: 1, REPAID: 3, 'WRITTEN OFF': 4 }[b.status]) || ((a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : 1));
    if (!list.length) return `<div class="card empty"><div class="section-title">${Store.list('loans').length ? 'Nothing here' : 'No loans yet'}</div>${Store.list('loans').length ? 'Try another filter.' : 'When you lend money to someone, record it here to keep track of who owes you.'}<div style="margin-top:14px"><button class="btn primary" data-action="add-loan">Lend money</button></div></div>`;
    return `<div class="loan-grid">${list.map(l => {
      const color = avatarColor(l.borrower);
      const open = f.open[l.id];
      const done = l.status === 'REPAID' || l.status === 'WRITTEN OFF';
      let due = 'No repayment date', dueCls = '';
      if (!done && l.dueDate) {
        if (l.daysToDue < 0) { due = `${-l.daysToDue} day${l.daysToDue === -1 ? '' : 's'} late · was due ${U.fmtDate(l.dueDate).replace(/, \d{4}$/, '')}`; dueCls = 'late'; }
        else if (l.daysToDue === 0) { due = 'Due today'; dueCls = 'soon'; }
        else if (l.daysToDue <= 7) { due = `Due in ${l.daysToDue} day${l.daysToDue === 1 ? '' : 's'} · ${U.fmtDay(l.dueDate)}`; dueCls = 'soon'; }
        else due = 'Due ' + U.fmtDate(l.dueDate);
      } else if (l.status === 'REPAID') { const last = l.repayments[l.repayments.length - 1]; due = 'Fully repaid' + (last ? ' · ' + U.fmtDate(last.date) : ''); dueCls = 'done'; }
      else if (l.status === 'WRITTEN OFF') { due = 'Written off · ' + U.peso(l.remainingAmount, true) + ' not expected back'; dueCls = 'off'; }
      return `<article class="loan-card s-${l.status.replace(' ', '_')} ${open ? 'open' : ''}" data-loan="${U.esc(l.id)}" style="--av:${color}">
        <button class="loan-head" data-action="loan-toggle" data-id="${U.esc(l.id)}" aria-expanded="${open ? 'true' : 'false'}">
          <span class="avatar">${U.esc(initials(l.borrower))}</span>
          <span class="who"><b>${U.esc(l.borrower)}</b> ${localTag(l)}<span class="sub">Lent ${U.esc(U.fmtDate(l.dateLent))} · ${U.esc(l.paymentMethod || '')}</span></span>
          <span class="amt"><b>${U.peso(done ? l.amount : l.remainingAmount, true)}</b><span class="sub">${done ? 'lent' : 'of ' + U.peso(l.amount, true) + ' left'}</span></span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
        <div class="loan-prog"><div class="bar"><i style="--p:${l.progress}"></i></div><div class="prog-meta"><span>${Math.round(l.progress * 100)}% repaid</span><span class="due ${dueCls}">${U.esc(due)}</span></div></div>
        <div class="loan-more">
          ${l.notes ? `<p class="loan-note">${U.esc(l.notes)}</p>` : ''}
          <div class="t-label" style="margin-bottom:6px">Repayments</div>
          ${l.repayments.length ? `<ol class="timeline">${l.repayments.map(r => `<li><span class="dot"></span><span class="tl-main"><b>${U.peso(r.amount)}</b> · ${U.esc(U.fmtDate(r.date))} · ${U.esc(r.paymentMethod || '')} ${localTag(r)}${r.notes ? `<span class="sub">${U.esc(r.notes)}</span>` : ''}</span><button class="btn sm ghost" data-action="void-loan-repayment" data-id="${U.esc(r.id)}" title="Remove this repayment">Undo</button></li>`).join('')}</ol>` : '<p class="sub" style="margin:0 0 10px;color:var(--muted)">Nothing paid back yet.</p>'}
          <div class="loan-actions">
            ${!done ? `<button class="btn sm pay" data-action="loan-repay" data-id="${U.esc(l.id)}">Record repayment</button>` : ''}
            <button class="btn sm" data-action="edit-loan" data-id="${U.esc(l.id)}">Edit</button>
            ${l.status === 'WRITTEN OFF' ? `<button class="btn sm" data-action="loan-writeoff" data-id="${U.esc(l.id)}" data-undo="1">Reopen</button>` : (!done ? `<button class="btn sm ghost" data-action="loan-writeoff" data-id="${U.esc(l.id)}">Write off</button>` : '')}
          </div>
        </div>
      </article>`;
    }).join('')}</div>`;
  },

  /* ============================== SAVINGS ============================== */
  savings() {
    const sv = Calc.savings();
    const cur = sv.rows[sv.rows.length - 1];
    const pct = r => r === null || r === undefined ? '—' : Math.round(r * 100) + '%';
    const tone = v => v < 0 ? 'neg' : '';
    Charts.pending = {};
    const rows = sv.rows.slice().reverse();
    return `${UI.cachedBanner()}
      <div class="hero" style="margin-bottom:18px"><div><div class="eyebrow">Since ${U.esc(sv.openingDate ? U.fmtDate(sv.openingDate) : U.monthLabel(sv.start))}</div><h2 style="font-size:32px">Savings</h2><div class="sub">Income received − everything paid out</div></div></div>
      <div class="stat-grid">
        <div class="card kpi lead"><div class="label">Saved in ${U.esc(U.monthLabel(cur.month).split(' ')[0])} so far</div><div class="value ${cur.saved < 0 ? 'neg-light' : ''}">${U.peso(cur.saved, true)}</div><div class="meta">${cur.rate === null ? 'No income received yet this month' : 'Saved ' + pct(cur.rate) + ' of income received'}</div></div>
        <div class="card kpi"><div class="label">Total saved</div><div class="value ${tone(sv.totalSaved)}">${U.peso(sv.totalSaved, true)}</div><div class="meta">${pct(sv.overallRate)} of ${U.peso(sv.totalIncome, true)} income</div></div>
        <div class="card kpi"><div class="label">Average per month</div><div class="value ${tone(sv.average || 0)}">${sv.average === null ? '—' : U.peso(sv.average, true)}</div><div class="meta">${sv.average === null ? 'Shows after your first full month' : 'Completed months only'}</div></div>
        <div class="card kpi"><div class="label">Cash on hand</div><div class="value ${tone(sv.openingBalance + sv.totalSaved - sv.netLent)}">${U.peso(sv.openingBalance + sv.totalSaved - sv.netLent, true)}</div><div class="meta">Starting ${U.peso(sv.openingBalance, true)} + saved${sv.netLent ? ' − lent out ' + U.peso(sv.netLent, true) : ''}${sv.owedToYou ? ' · <a href="#/loans">' + U.peso(sv.owedToYou, true) + ' owed to you</a>' : ''}</div></div>
      </div>
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><h3 class="card-title">Saved per month</h3><span class="sub" style="font-size:12.5px;color:var(--muted)">${sv.best ? 'Best: ' + U.esc(U.monthLabel(sv.best.month)) + ' · ' + U.peso(sv.best.saved, true) : ''}</span></div>
        <div class="legend"><span><i style="background:var(--c-income)"></i>Saved</span><span><i style="background:var(--c-out)"></i>Spent more than received</span><span><i style="background:var(--c-income);opacity:.55"></i>This month (so far)</span></div>
        ${Charts.register('savings', Charts.savings(sv.rows.slice(-12)))}
      </div>
      <div class="card">
        <div class="table-scroll" style="padding:6px 12px 14px"><table class="report-table">
          <thead><tr><th>Month</th><th class="n">Income received</th><th class="n">Bills paid</th><th class="n">Other expenses</th><th class="n">Saved</th><th class="n">Savings rate</th><th class="n">Running total</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td>${U.esc(U.monthLabel(r.month))}${r.partial ? ' <span class="sub" style="color:var(--muted)">(so far)</span>' : ''}</td><td class="n">${U.peso(r.income)}</td><td class="n">${U.peso(r.bills)}</td><td class="n">${U.peso(r.other)}</td><td class="n ${tone(r.saved)}"><b>${U.peso(r.saved)}</b></td><td class="n">${pct(r.rate)}</td><td class="n">${U.peso(r.running)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="list-foot"><span class="sub" style="font-weight:500">Counted by the date money actually came in or went out.${sv.openingDate ? '' : ' Set a starting balance in Settings to fix the start date.'}</span></div>
      </div>`;
  },

  /* ============================== BILLS ============================== */
  bills() {
    const f = UI.filters.bills;
    const cats = Array.from(new Set(Store.list('billInstances').map(i => i.category).filter(Boolean))).sort();
    const inst = Calc.instances().filter(i => i.billingPeriod === Store.month && !i.isVoid);
    const count = st => inst.filter(i => i.status === st).length;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Bills · ${U.esc(U.monthLabel(Store.month))}</h2></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/recurring">Manage recurring</a></div></div>
      <div class="chips">${[['', 'All', inst.length], ['OVERDUE', 'Overdue', count('OVERDUE')], ['UNPAID', 'Unpaid', count('UNPAID')], ['PARTIAL', 'Partial', count('PARTIAL')], ['PAID', 'Paid', count('PAID')], ['OVER BUDGET', 'Over budget', count('OVER BUDGET')]].map(c => `<button class="chip ${f.status === c[0] ? 'on' : ''}" data-action="bill-chip" data-status="${c[0]}">${c[1]} <b>${c[2]}</b></button>`).join('')}</div>
      <div class="filters">
        <div class="field grow"><label for="fbS">Search</label><input id="fbS" class="input" type="search" placeholder="Bill name, category or note" value="${U.esc(f.search)}" data-filter="bills.search"></div>
        <div class="field"><label for="fbSt">Status</label><select id="fbSt" class="input" data-filter="bills.status">${UI.options([{ value: 'OVERDUE', label: 'Overdue' }, { value: 'UNPAID', label: 'Unpaid' }, { value: 'PARTIAL', label: 'Partial' }, { value: 'PAID', label: 'Paid' }, { value: 'OVER BUDGET', label: 'Over budget' }], f.status, 'All statuses')}</select></div>
        <div class="field"><label for="fbC">Category</label><select id="fbC" class="input" data-filter="bills.category">${UI.options(cats, f.category, 'All categories')}</select></div>
      </div>
      <div class="card" id="listBody">${this.billsList()}</div>`;
  },
  billsList() {
    const f = UI.filters.bills, q = f.search.trim().toLowerCase();
    const list = Calc.instances().filter(i => i.billingPeriod === Store.month && !i.isVoid && (!f.status || i.status === f.status) && (!f.category || i.category === f.category) &&
      (!q || [i.billName, i.category, i.notes, i.status].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : String(a.billName).localeCompare(b.billName)));
    if (!list.length) return `<div class="empty"><div class="section-title">No bills found</div>${Store.list('billInstances').length ? 'Try another filter or month.' : (Api.configured() ? 'Bills appear after the first sync.' : 'Connect to Google Sheets in Settings to load your bills.')}</div>`;
    let te = 0, tp = 0, tr = 0;
    const rows = list.map(i => {
      te += U.cents(i.expectedAmount); tp += U.cents(i.actualAmount); tr += Math.max(0, U.cents(i.remainingAmount));
      const done = i.status === ST.PAID || i.status === ST.OVER;
      return `<div class="row cols-bills">
        <div class="primary-cell"><div class="name">${U.esc(i.billName)} ${localTag(i.hasLocal ? { syncStatus: 'pending' } : null)}</div><div class="sub">${i.arrivalDate && i.arrivalDate !== i.dueDate ? (i.arrivalDate > U.today() ? 'Arrives ' : 'Arrived ') + U.esc(U.fmtDate(i.arrivalDate)) + ' · ' : ''}${U.esc(i.category || '')}${i.frequency ? ' · ' + U.esc(i.frequency.toLowerCase()) : ''}${i.notes ? ' · ' + U.esc(i.notes) : ''}</div></div>
        <div data-label="Due">${U.fmtDate(i.dueDate)}</div>
        <div class="num" data-label="Expected">${U.peso(i.expectedAmount)}</div>
        <div class="num" data-label="Paid">${i.paymentCount ? U.peso(i.actualAmount) : '<span style="color:var(--muted)">—</span>'}</div>
        <div class="num c-diff" data-label="${i.remainingAmount < 0 ? 'Overpaid' : 'Remaining'}">${i.remainingAmount < 0 ? '<span style="color:var(--over)">+' + U.peso(-i.remainingAmount) + '</span>' : U.peso(i.remainingAmount)}</div>
        <div class="status-cell">${tagFor(i.status)}</div>
        <div class="actions">${done ? '' : `<button class="btn sm pay" data-action="pay" data-id="${U.esc(i.billInstanceId)}">${i.paymentCount ? 'Pay balance' : 'Mark as Paid'}</button>`}<button class="btn sm" data-action="bill-details" data-id="${U.esc(i.billInstanceId)}">Details</button></div>
      </div>`;
    }).join('');
    return `<div class="list"><div class="row head cols-bills"><div>Bill</div><div>Due</div><div class="num">Expected</div><div class="num">Paid</div><div class="num c-diff">Remaining</div><div>Status</div><div></div></div>${rows}</div>
      <div class="list-foot"><span>${list.length} bill${list.length === 1 ? '' : 's'}</span><span>Expected ${U.peso(U.fromCents(te))} · Paid ${U.peso(U.fromCents(tp))} · Remaining ${U.peso(U.fromCents(tr))}</span></div>`;
  },

  /* ============================== EXPENSES ============================== */
  expenses() {
    const f = UI.filters.expenses;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Other Expenses</h2></div><button class="btn primary" data-action="add-expense">${svgIcon('plus', 16)} Add expense</button></div>
      <div class="filters">
        <div class="field grow"><label for="feS">Search</label><input id="feS" class="input" type="search" placeholder="Description, note, method" value="${U.esc(f.search)}" data-filter="expenses.search"></div>
        <div class="field"><label for="feC">Category</label><select id="feC" class="input" data-filter="expenses.category">${UI.options(Store.categories('EXPENSE'), f.category, 'All categories')}</select></div>
        <div class="field"><label for="feF">From</label><input id="feF" class="input" type="date" value="${U.esc(f.from)}" data-filter="expenses.from"></div>
        <div class="field"><label for="feT">To</label><input id="feT" class="input" type="date" value="${U.esc(f.to)}" data-filter="expenses.to"></div>
      </div>
      <div class="card" id="listBody">${this.expensesList()}</div>`;
  },
  dateScope(f, d) {
    if (f.from || f.to) return (!f.from || d >= f.from) && (!f.to || d <= f.to);
    return String(d).slice(0, 7) === Store.month;
  },
  scopeLabel(f) { return f.from || f.to ? (f.from ? U.fmtDate(f.from) : 'Start') + ' – ' + (f.to ? U.fmtDate(f.to) : 'today') : U.monthLabel(Store.month); },
  expensesList() {
    const f = UI.filters.expenses, q = f.search.trim().toLowerCase();
    const list = Store.list('expenses').filter(e => !U.bool(e.isDeleted) && this.dateScope(f, e.date) && (!f.category || e.category === f.category) &&
      (!q || [e.description, e.category, e.notes, e.paymentMethod].join(' ').toLowerCase().includes(q))).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1)));
    if (!list.length) return `<div class="empty"><div class="section-title">No expenses</div>Nothing recorded for ${U.esc(this.scopeLabel(f))}.<div style="margin-top:14px"><button class="btn primary" data-action="add-expense">Add expense</button></div></div>`;
    const total = list.reduce((a, e) => a + U.cents(e.amount), 0);
    return `<div class="list"><div class="row head cols-exp"><div>Date</div><div>Description</div><div>Category</div><div>Method</div><div class="num">Amount</div><div></div></div>
      ${list.map(e => `<div class="row cols-exp">
        <div data-label="Date">${U.fmtDate(e.date)}</div>
        <div class="primary-cell"><div class="name">${U.esc(e.description)} ${localTag(e)}</div>${e.notes ? `<div class="sub">${U.esc(e.notes)}</div>` : ''}</div>
        <div data-label="Category">${U.esc(e.category)}</div>
        <div data-label="Method">${U.esc(e.paymentMethod)}</div>
        <div class="num status-cell"><b>${U.peso(e.amount)}</b></div>
        <div class="actions"><button class="btn sm" data-action="edit-expense" data-id="${U.esc(e.id)}">Edit</button><button class="btn sm danger" data-action="delete-expense" data-id="${U.esc(e.id)}">Delete</button></div>
      </div>`).join('')}</div>
      <div class="list-foot"><span>${list.length} expense${list.length === 1 ? '' : 's'} · ${U.esc(this.scopeLabel(f))}</span><span>Total ${U.peso(U.fromCents(total))}</span></div>`;
  },

  /* ============================== INCOME ============================== */
  income() {
    const f = UI.filters.income;
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Income</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="add-recurring-income">${svgIcon('recurring', 16)} Add recurring income</button><button class="btn primary" data-action="add-income">${svgIcon('plus', 16)} Add other income</button></div></div>
      ${this.recurringIncomeCard()}
      <div class="filters">
        <div class="field grow"><label for="fiS">Search</label><input id="fiS" class="input" type="search" placeholder="Source, note, status" value="${U.esc(f.search)}" data-filter="income.search"></div>
        <div class="field"><label for="fiC">Category</label><select id="fiC" class="input" data-filter="income.category">${UI.options(Store.categories('INCOME'), f.category, 'All categories')}</select></div>
        <div class="field"><label for="fiF">From</label><input id="fiF" class="input" type="date" value="${U.esc(f.from)}" data-filter="income.from"></div>
        <div class="field"><label for="fiT">To</label><input id="fiT" class="input" type="date" value="${U.esc(f.to)}" data-filter="income.to"></div>
      </div>
      <div class="card" id="listBody">${this.incomeList()}</div>`;
  },
  incomeList() {
    const f = UI.filters.income, q = f.search.trim().toLowerCase();
    const list = Store.list('income').filter(r => !U.bool(r.isDeleted) && this.dateScope(f, r.date) && (!f.category || r.category === f.category) &&
      (!q || [r.source, r.category, r.notes, r.paymentMethod, r.status].join(' ').toLowerCase().includes(q))).sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!list.length) return `<div class="empty"><div class="section-title">No income recorded</div>Nothing for ${U.esc(this.scopeLabel(f))}.<div style="margin-top:14px"><button class="btn primary" data-action="add-income">Add income</button></div></div>`;
    let te = 0, ta = 0;
    list.forEach(r => { if (r.status !== 'CANCELLED') { te += U.cents(r.expectedAmount); ta += U.cents(r.actualAmount); } });
    return `<div class="list"><div class="row head cols-inc"><div>Date</div><div>Source</div><div>Category</div><div class="num">Expected</div><div class="num">Received</div><div>Status</div><div></div></div>
      ${list.map(r => `<div class="row cols-inc ${r.status === 'CANCELLED' ? 'dim' : ''}">
        <div data-label="Date">${U.fmtDate(r.date)}</div>
        <div class="primary-cell"><div class="name">${U.esc(r.source)} ${localTag(r)}</div><div class="sub">${U.esc(r.paymentMethod || '')}${r.notes ? ' · ' + U.esc(r.notes) : ''}</div></div>
        <div data-label="Category">${U.esc(r.category)}</div>
        <div class="num" data-label="Expected">${U.peso(r.expectedAmount)}</div>
        <div class="num" data-label="Received">${U.blank(r.actualAmount) ? '<span style="color:var(--muted)">—</span>' : U.peso(r.actualAmount)}</div>
        <div class="status-cell">${tagFor(r.status || 'PENDING')}</div>
        <div class="actions">${U.blank(r.actualAmount) && r.status !== 'CANCELLED' ? `<button class="btn sm pay" data-action="receive-income" data-id="${U.esc(r.id)}">Mark received</button>` : ''}<button class="btn sm" data-action="edit-income" data-id="${U.esc(r.id)}">Edit</button>${r.recurringIncomeId ? '' : `<button class="btn sm danger" data-action="delete-income" data-id="${U.esc(r.id)}">Delete</button>`}</div>
      </div>`).join('')}</div>
      <div class="list-foot"><span>${list.length} entr${list.length === 1 ? 'y' : 'ies'} · ${U.esc(this.scopeLabel(f))}</span><span>Expected ${U.peso(U.fromCents(te))} · Received ${U.peso(U.fromCents(ta))}</span></div>`;
  },

  /* ============================== RECURRING ============================== */
  recurring() {
    const list = Store.list('recurringBills').sort((a, b) => (U.bool(b.isActive) - U.bool(a.isActive)) || FREQUENCIES.indexOf(a.frequency) - FREQUENCIES.indexOf(b.frequency) || String(a.name).localeCompare(b.name));
    const active = list.filter(b => U.bool(b.isActive));
    const monthlyFixed = active.filter(b => b.frequency === 'MONTHLY').reduce((a, b) => a + U.cents(b.amount), 0);
    const weekly = active.filter(b => b.frequency === 'WEEKLY').reduce((a, b) => a + U.cents(b.amount), 0);
    const equiv = active.reduce((a, b) => a + Math.round(Calc.monthlyEquivalent(b) * 100), 0);
    const offline = !navigator.onLine || !Api.configured();
    return `${UI.cachedBanner()}
      <div class="toolbar"><div class="left"><h2 class="section-title">Recurring Bills</h2></div><button class="btn primary" data-action="add-recurring">${svgIcon('plus', 16)} Add recurring bill</button></div>
      ${offline ? '<div class="banner"><span class="grow">Changes to recurring bills are queued and applied when you are online — bill instances are generated by the server so that duplicates are impossible.</span></div>' : ''}
      <div class="stat-grid">

  /* ============================== SYNC CENTER ============================== */
  sync() {
    const online = navigator.onLine && Sync.reachable !== false;
    const q = Store.queue;
    const pending = Store.pendingCount(), failed = Store.failedCount();
    const label = o => ({ EXPENSE: 'Expense', INCOME: 'Income', PAYMENT: 'Payment', RECURRING_BILL: 'Recurring bill', BILL_INSTANCE: 'Bill', BUDGET: 'Budget', SETTINGS: 'Settings', LOAN: 'Lent money', LOAN_REPAYMENT: 'Loan repayment', RECURRING_INCOME: 'Income schedule' }[o.entityType] || o.entityType) + ' · ' + ({ CREATE: 'create', UPDATE: 'update', DELETE: o.entityType === 'PAYMENT' ? 'void' : 'delete', PAYMENT: 'payment', DISABLE: 'disable', ENABLE: 'enable' }[o.action] || o.action.toLowerCase());

      <div class="toolbar"><div class="left"><span class="sub" style="color:var(--ink-2)">${Sync.lastError ? '<span class="neg">' + U.esc(Sync.lastError) + '</span>' : 'Every change is stored in IndexedDB first and sent with a unique operation ID, so retries can never create duplicates.'}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="full-refresh">Full refresh</button><button class="btn primary" data-action="sync-now" ${Api.configured() ? '' : 'disabled'}>Sync now</button></div></div>
      ${Store.conflicts.length ? `<div class="card" style="margin-bottom:18px"><div class="card-head"><h3 class="card-title">Needs review</h3></div><div class="list" style="margin-top:8px">${Store.conflicts.map(c => `<div class="row" style="grid-template-columns:1fr auto">
          <div><div class="name">${U.esc(label(c.op))}</div><div class="sub">${U.esc(c.message)}</div>
          ${c.conflict ? `<div class="sub" style="margin-top:6px">${(c.conflict.fields || []).map(fl => `<b>${U.esc(fl)}</b>: this device <b>${U.esc(fmtVal(c.conflict.local && c.conflict.local[fl]))}</b> vs server <b>${U.esc(fmtVal(c.conflict.server && c.conflict.server[fl]))}</b>`).join('<br>')}</div>` : ''}</div>
          <div class="actions"><button class="btn sm" data-action="conflict-server" data-id="${U.esc(c.operationId)}">Keep server version</button><button class="btn sm primary" data-action="conflict-mine" data-id="${U.esc(c.operationId)}">Keep this device's version</button></div></div>`).join('')}</div></div>` : ''}
      <div class="grid-2">
        <div class="card"><div class="card-head"><h3 class="card-title">Sync queue</h3><span class="sub" style="color:var(--muted);font-size:12.5px">${q.length} operation${q.length === 1 ? '' : 's'}</span></div>
          <div class="list" style="margin-top:8px">${q.length ? q.map(o => `<div class="row" style="grid-template-columns:1fr auto">
            <div><div class="name">${U.esc(label(o))} <span class="tag ${o.status === 'REJECTED' || o.status === 'FAILED' ? 'OVERDUE' : o.status === 'NEEDS_REVIEW' ? 'PARTIAL' : 'UNPAID'}">${U.esc(o.status)}</span></div>
            <div class="sub">${U.esc(describe(o))}</div><div class="sub">Queued ${U.esc(U.fmtTime(o.createdAt))}${o.retryCount ? ' · ' + o.retryCount + ' attempt' + (o.retryCount > 1 ? 's' : '') : ''}${o.lastError ? ' · <span class="neg">' + U.esc(o.lastError) + '</span>' : ''}</div><div class="mono" style="color:var(--muted)">${U.esc(o.operationId)}</div></div>
            <div class="actions">${o.status !== 'NEEDS_REVIEW' ? `<button class="btn sm" data-action="retry-op" data-id="${U.esc(o.operationId)}">Retry</button>` : ''}<button class="btn sm danger" data-action="discard-op" data-id="${U.esc(o.operationId)}">Discard</button></div></div>`).join('') : '<div class="empty">✓ All changes synced. Nothing is waiting.</div>'}</div></div>
        <div class="card"><div class="card-head"><h3 class="card-title">Recent activity &amp; sync errors</h3></div>
          <div class="list" style="margin-top:8px">${Store.log.length ? Store.log.slice(0, 40).map(l => `<div class="row" style="grid-template-columns:1fr auto;padding:10px 24px"><div><div class="name" style="font-size:13.5px">${U.esc(l.message)}</div><div class="sub">${U.esc(l.type)}${l.operationId ? ' · ' + U.esc(l.operationId) : ''}</div></div><div class="sub">${U.esc(U.fmtTime(l.at))}</div></div>`).join('') : '<div class="empty">No activity yet.</div>'}</div></div>
      </div>
      <div class="card card-pad" style="margin-top:18px"><div class="card-title" style="margin-bottom:10px">On this device</div>
        <dl class="kv"><dt>Local database</dt><dd>${LocalDB.memory ? '<span class="neg">Temporary memory only — ' + U.esc(LocalDB.memoryReason) + '</span>' : 'IndexedDB'}</dd>
        <dt>Persistent storage</dt><dd>${LocalDB.persistent ? 'Granted (browser will not evict data)' : 'Best effort'}</dd>
        <dt>Cached records</dt><dd>${Object.keys(ENTITY).reduce((a, s) => a + Store.list(s).length, 0)}</dd>
        <dt>Device ID</dt><dd class="mono">${U.esc(Store.meta.clientId || '')}</dd></dl></div>`;
  },

  settings() {

    return `

            ${IS_GAS ? '' : `<details class="full"><summary class="sub" style="cursor:pointer;color:var(--muted)">Advanced: Web App URL</summary><div class="field" style="margin-top:10px"><input id="cUrl" name="apiUrl" class="input" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${U.esc(Api.url())}"><span class="hint">Already set. Change only if you redeploy Apps Script to a new URL.</span></div></details>`}
            <div class="form-error full" id="connErr"></div>

            <div class="card-title" style="margin-bottom:6px">Connect another device</div>
            <p class="sub" style="color:var(--ink-2);margin:0 0 12px">Or skip typing the password on your phone: copy a setup link and open it there once. It signs that device in, so send it only to yourself.</p>
            <button class="btn" type="button" data-action="copy-setup-link">Copy setup link</button>
            <div id="setupLinkBox" class="mono" style="display:none;margin-top:10px;padding:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px"></div>
          </div>` : ''}
        </div>
        <div class="card card-pad">
          <h3 class="section-title" style="margin-bottom:6px">Budget</h3>
          <p class="sub" style="color:var(--ink-2);margin-top:0">The planned budget for each month. Months without their own value use the default.</p>
          <dl class="kv" style="margin:14px 0"><dt>${U.esc(U.monthLabel(Store.month))}</dt><dd>${U.peso(b.amount)} ${b.source === 'default' ? '<span class="sub">(default)</span>' : ''}</dd><dt>Default monthly budget</dt><dd>${U.peso(s.defaultMonthlyBudget || 0)}</dd><dt>Watch threshold</dt><dd>${Math.round(Number(s.watchThreshold || 0.9) * 100)}% of budget</dd></dl>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-action="edit-budget">Adjust ${U.esc(U.monthLabel(Store.month))}</button><button class="btn" data-action="edit-default-budget">Change default</button></div>
          <div style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px">
            <div class="card-title" style="margin-bottom:6px">Starting balance</div>
            <p class="sub" style="color:var(--ink-2);margin:0 0 10px">Money you already had on the start date. Cash on hand and Safe to spend count everything received and spent from that date on, and carry over month to month.</p>
            <dl class="kv" style="margin:0 0 12px"><dt>Amount</dt><dd>${U.peso(s.openingBalance || 0)}</dd><dt>As of</dt><dd>${U.isYmd(s.openingBalanceDate || '') ? U.fmtDate(s.openingBalanceDate) : '—'}</dd></dl>

          <dt>Offline app shell</dt><dd id="swState">${'serviceWorker' in navigator && !IS_GAS ? (navigator.serviceWorker.controller ? 'Active' : 'Installing…') : 'Not available in this mode'}</dd>

          ${IS_GAS ? '<p class="sub" style="color:var(--muted)">To install as an app and open it with no internet, host the PWA files on HTTPS (see README → PWA setup).</p>' : ''}
        </div>
        <div class="card card-pad">
          <h3 class="section-title" style="margin-bottom:6px">Data on this device</h3>
          <p class="sub" style="color:var(--ink-2);margin-top:0">Google Sheets is the master copy. This device keeps a cache plus any changes not yet synced.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn" data-action="export-backup">Download local backup (JSON)</button><button class="btn danger" data-action="clear-local">Clear local cache</button></div>

  }
};
const AVATAR_COLORS = ['#2470A8', '#C0643A', '#3E7A55', '#7B4B94', '#B0832A', '#2D8C8C', '#B0466E', '#5A6B2E'];
function avatarColor(name) { let h = 0; String(name || '').toLowerCase().trim().split('').forEach(ch => { h = (h * 31 + ch.charCodeAt(0)) >>> 0; }); return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function initials(name) { const p = String(name || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : (p[0] || '')[1] || '')).toUpperCase(); }
function fmtVal(v) { return U.blank(v) ? '(blank)' : typeof v === 'number' ? U.peso(v) : String(v); }

/* ------------------------------------------------------------------ Reports */
const Reports = {
  build() {
    const f = UI.filters.reports;
    let from = U.isYm(f.from) ? f.from : Store.month, to = U.isYm(f.to) ? f.to : from;
    if (to < from) [from, to] = [to, from];
    const months = U.monthRange(from, to).slice(0, 60);
    const inRange = d => { const m = String(d).slice(0, 7); return m >= from && m <= to; };
    const period = from === to ? U.monthLabel(from) : U.monthLabel(from) + ' – ' + U.monthLabel(to);
    const today = U.today();
    const inst = Calc.instances(today);
    const sum = (rows, k) => U.fromCents(rows.reduce((a, r) => a + U.cents(r[k]), 0));
    switch (f.type) {
      case 'income': {
        const rows = Store.list('income').filter(r => !U.bool(r.isDeleted) && inRange(r.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
        const active = rows.filter(r => r.status !== 'CANCELLED');
        return { title: 'Income Report', period, rows, columns: [{ key: 'date', label: 'Date', date: true }, { key: 'source', label: 'Source' }, { key: 'category', label: 'Category' }, { key: 'paymentMethod', label: 'Method' }, { key: 'status', label: 'Status' }, { key: 'expectedAmount', label: 'Expected', money: true }, { key: 'actualAmount', label: 'Received', money: true }, { key: 'notes', label: 'Notes' }],
          totals: { expectedAmount: sum(active, 'expectedAmount'), actualAmount: sum(active, 'actualAmount') },
          highlights: [['Expected', U.peso(sum(active, 'expectedAmount'))], ['Received', U.peso(sum(active, 'actualAmount'))], ['Entries', String(rows.length)]] };
      }
      case 'expense': {
