<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Household Finances</title>
<meta name="description" content="Household Finances — Budget & Bill Monitoring">
<meta name="theme-color" content="#2B2926">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#FAF8F5; --surface-3:#F1EDE6;
  --ink:#2B2926; --ink-2:#57524B; --muted:#8A8379; --line:#E7E1D8; --line-2:#D8D0C4;
  --gold:#A8865A; --focus:#2470A8;
  --paid:#3E7A55; --paid-bg:#E6F0E9;
  --partial:#94661A; --partial-bg:#F5ECD8;
  --unpaid:#6B665E; --unpaid-bg:#ECE8E2;
  --overdue:#B0363A; --overdue-bg:#F6E1DF;
  --over:#76468F; --over-bg:#EEE4F3;
  --void:#9A948B; --void-bg:#F1EFEB;
  --c-expected:#8F877B; --c-actual:#2B2926; --c-income:#2470A8; --c-out:#C0643A;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(43,41,38,.04),0 6px 24px rgba(43,41,38,.05);
  --shadow-lg:0 20px 60px rgba(43,41,38,.18);
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sidebar:248px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 18px 18px}
.brand{padding:0 10px 26px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand-title{font-family:var(--serif);font-size:23px;line-height:1.1;font-weight:600;letter-spacing:.2px}
.brand-sub{margin-top:8px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand-rule{width:28px;height:2px;background:var(--gold);margin-top:14px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14.5px}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--ink);color:#F7F4EF}
.nav .badge{margin-left:auto;background:var(--partial-bg);color:var(--partial);font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px}
.nav a.active .badge{background:rgba(255,255,255,.18);color:#fff}
.sidebar-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,241,236,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 36px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;flex:1;min-width:140px;letter-spacing:.2px}
.content{padding:28px 36px 60px;max-width:1320px;width:100%;margin:0 auto}
.bottomnav{display:none}

/* ---------- Status pill (connection) ---------- */
.conn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--paid);flex:none}
.conn[data-state=offline] .dot{background:var(--unpaid)}
.conn[data-state=syncing] .dot{background:var(--focus);animation:pulse 1s infinite}
.conn[data-state=pending] .dot,.conn[data-state=failed] .dot{display:none}
.conn[data-state=pending]{color:var(--partial);background:var(--partial-bg);border-color:transparent}
.conn[data-state=failed]{color:var(--overdue);background:var(--overdue-bg);border-color:transparent}
.conn[data-state=complete]{color:var(--paid);background:var(--paid-bg);border-color:transparent}
.conn[data-state=complete] .dot{display:none}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Month selector ---------- */
.month-sel{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month-sel button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.month-sel button:hover{background:var(--surface-3)}
.month-sel label{position:relative;padding:0 10px;font-weight:600;font-size:14px;min-width:132px;text-align:center;cursor:pointer}
.month-sel input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* ---------- Buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:#F7F4EF;border-color:var(--ink)}
.btn.primary:hover{background:#45413B}
.btn.danger{color:var(--overdue);border-color:#E7C3C0}
.btn.danger:hover{background:var(--overdue-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:5px 11px;font-size:13px;min-height:32px;border-radius:8px}
.btn.pay{background:var(--ink);color:#F7F4EF;border-color:var(--ink)}
.btn[disabled],.btn.busy{opacity:.55;cursor:not-allowed;pointer-events:none}
.btn svg{width:16px;height:16px}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(43,41,38,.08)}
.input.invalid{border-color:var(--overdue)}
.money-wrap{position:relative}
.money-wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money-wrap .input{padding-left:28px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-error{color:var(--overdue);background:var(--overdue-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;display:none}
.form-error.show{display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.filters .field{flex:1 1 160px;max-width:260px}
.filters .field.grow{flex:2 1 220px;max-width:none}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.toolbar .left{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px 24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px 0}
.card-title{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:0}
.section-title{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.hero h2{font-family:var(--serif);font-size:38px;line-height:1.05;font-weight:600;margin:6px 0 0;letter-spacing:.2px}
.hero .sub{font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .label{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi .value{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px;letter-spacing:.2px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.kpi.lead{background:var(--ink);color:#F7F4EF;border-color:var(--ink)}
.kpi.lead .label,.kpi.lead .meta{color:#CFC8BD}
.kpi .tone{position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0}
.neg{color:var(--overdue)}
.pos{color:var(--paid)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.grid-3-1{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}

/* ---------- Status tags ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.PAID{color:var(--paid);background:var(--paid-bg)}
.tag.PARTIAL{color:var(--partial);background:var(--partial-bg)}
.tag.UNPAID{color:var(--unpaid);background:var(--unpaid-bg)}
.tag.OVERDUE{color:var(--overdue);background:var(--overdue-bg)}
.tag.OVER{color:var(--over);background:var(--over-bg)}
.tag.VOID{color:var(--void);background:var(--void-bg)}
.tag.RECEIVED{color:var(--paid);background:var(--paid-bg)}
.tag.PENDING{color:var(--unpaid);background:var(--unpaid-bg)}
.tag.CANCELLED{color:var(--void);background:var(--void-bg)}
.tag.local{color:var(--partial);background:var(--partial-bg)}
.tag.local::before{display:none}
.health{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1.6px;font-size:13px;padding:6px 14px;border-radius:999px}
.health.ON{color:var(--paid);background:var(--paid-bg)}
.health.WATCH{color:var(--partial);background:var(--partial-bg)}
.health.OVER{color:var(--overdue);background:var(--overdue-bg)}

/* ---------- Lists (table on desktop, cards on mobile) ---------- */
.list{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:14px;padding-bottom:10px;border-top:0}
.row .name{font-weight:600}
.row .sub{font-size:12.5px;color:var(--muted)}
.row .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.row:hover:not(.head){background:var(--surface-2)}
.cols-bills{grid-template-columns:minmax(150px,2fr) 110px 110px 110px 110px 120px 180px}
.cols-exp{grid-template-columns:110px minmax(150px,2fr) 130px 130px 120px 130px}
.cols-inc{grid-template-columns:110px minmax(140px,2fr) 110px 120px 120px 110px 130px}
.cols-pay{grid-template-columns:110px minmax(150px,2fr) 110px 130px minmax(100px,1fr) 100px}
.cols-rec{grid-template-columns:minmax(150px,2fr) 120px minmax(150px,1.4fr) 130px 100px 190px}
.cols-mini{grid-template-columns:1fr auto auto;padding:12px 24px}
.dim{opacity:.55}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .section-title{color:var(--ink);margin-bottom:6px;font-size:18px}
.list-foot{display:flex;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius);font-weight:600;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#F7F4EF}
.chip b{font-variant-numeric:tabular-nums}

/* ---------- Health / progress ---------- */
.meter{position:relative;height:10px;border-radius:10px;background:var(--surface-3);overflow:visible;margin:18px 0 8px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--ink)}
.meter .proj{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--gold)}
.meter-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.reasons{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.reasons li{font-size:13.5px;color:var(--ink-2);padding-left:18px;position:relative}
.reasons li::before{content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- Charts ---------- */
.chart{padding:8px 24px 22px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink-2);font-size:11px}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:default}
.chart [data-tip]:hover{opacity:.82}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 24px 0;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tooltip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:#F7F4EF;font-size:12.5px;padding:8px 11px;border-radius:8px;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transition:opacity .1s;white-space:pre-line}
.tooltip.show{opacity:1}

/* ---------- Banner, toast, modal ---------- */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink-2);font-size:13.5px;margin-bottom:18px;flex-wrap:wrap}
.banner.warn{background:var(--partial-bg);border-color:transparent;color:#6E4C10}
.banner.err{background:var(--overdue-bg);border-color:transparent;color:#7D2427}
.banner .grow{flex:1;min-width:200px}
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#F7F4EF;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:toastIn .2s ease-out}
.toast.err{background:#7D2427}
.toast.warn{background:#6E4C10}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;opacity:.7;cursor:pointer;font-size:16px;line-height:1}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}}
.modal-back{position:fixed;inset:0;background:rgba(43,41,38,.42);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(760px,100%)}
.modal-head{padding:22px 26px 6px;display:flex;align-items:flex-start;gap:12px}
.modal-head h3{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;flex:1}
.modal-head .eyebrow{display:block;margin-bottom:4px}
.modal-body{padding:14px 26px 8px;overflow:auto}
.modal-foot{padding:16px 26px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.close-x{border:0;background:var(--surface-3);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink-2)}
.summary-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.summary-box div span{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.summary-box div b{font-size:17px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.report-table{width:100%;border-collapse:collapse;font-size:13.5px}
.report-table th{text-align:left;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.report-table td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.report-table td.n,.report-table th.n{text-align:right;font-variant-numeric:tabular-nums}
.report-table tfoot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.install-card{display:none}
.install-card.show{display:flex}
.print-only{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .cols-bills{grid-template-columns:minmax(140px,2fr) 100px 100px 100px 120px 160px}
  .cols-bills .c-diff{display:none}
}
@media (max-width:1020px){
  .grid-2,.grid-3-1{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:12px 16px;gap:10px}
  .topbar h1{font-size:19px}
  .content{padding:18px 16px 110px}
  .hero h2{font-size:30px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:14px 16px}
  .kpi .value{font-size:23px}
  .kpi.lead{grid-column:1/-1}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;border-radius:10px;position:relative}
  .bottomnav svg{width:21px;height:21px;stroke:currentColor}
  .bottomnav .active{color:var(--ink)}
  .bottomnav .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--overdue);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px}
  .row.head{display:none}
  .row{grid-template-columns:1fr auto !important;gap:6px 12px;padding:14px 16px}
  .row > [data-label]{display:flex;justify-content:space-between;gap:10px;grid-column:1/-1;font-size:13.5px;text-align:left}

<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Main navigation">

      <div class="brand-sub">Budget &amp; Bill Monitoring</div>
      <div class="brand-rule"></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <button class="btn sm install-card" id="installBtnSide" type="button" data-action="install">Install app</button>
      <button class="conn" id="connSide" type="button" data-action="go" data-view="sync"><span class="dot"></span><span class="txt">Starting…</span></button>
    </div>
  </aside>
  <div class="main">

        <button type="button" data-action="month-prev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <label><span id="monthLabel">—</span><input type="month" id="monthInput" aria-label="Select month"></label>
        <button type="button" data-action="month-next" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

    </header>

</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<noscript><p style="padding:20px">Household Finances needs JavaScript enabled.</p></noscript>
<script>
'use strict';
/* =============================================================================
 * HOUSEHOLD FINANCES — frontend (offline-first)
 * Layers:  Util → LocalDB (IndexedDB) → Store (in-memory) → Calc (same rules as
 *          Code.gs) → Api (fetch or google.script.run) → Sync (queue engine) → UI
 * ========================================================================== */
const APP_VERSION = '1.0.0';
const TZ = 'Asia/Manila';
const PAYMENT_METHODS = ['Cash', 'Bank Transfer', 'Online Bank', 'Credit Card', 'Debit Card', 'GCash', 'Other'];
const FREQUENCIES = ['WEEKLY', 'MONTHLY', 'QUARTERLY', 'YEARLY', 'CUSTOM'];
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DEFAULT_CATEGORIES = {
  EXPENSE: ['Groceries', 'Transportation', 'Pet', 'Shopping', 'Dining', 'Medical', 'Home', 'Entertainment', 'Other'],
  INCOME: ['Salary', 'Side Income', 'Freelance', 'Bonus', 'Other'],
  BILL: ['Utilities', 'Housing', 'Debt', 'Pet', 'Household Help', 'Subscriptions', 'Insurance', 'Other']
};
const ST = { UNPAID: 'UNPAID', PARTIAL: 'PARTIAL', PAID: 'PAID', OVERDUE: 'OVERDUE', OVER: 'OVER BUDGET', VOID: 'VOID' };
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const REQUEST_TIMEOUT_MS = 25000;
const SYNC_BATCH = 50;

/* ------------------------------------------------------------------ Util */
const U = {
  pad2: n => (n < 10 ? '0' : '') + n,
  today() {
    try {
      const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day}`;
    } catch (e) {
      const d = new Date(Date.now() + 8 * 3600 * 1000);   // Manila is UTC+8 with no DST
      return d.toISOString().slice(0, 10);
    }
  },
  nowIso: () => new Date().toISOString(),
  curMonth: () => U.today().slice(0, 7),
  isYmd: s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s),
  isYm: s => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s),
  dim: (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(),
  ymdToDays: s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000),
  daysToYmd(n) { const d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + U.pad2(d.getUTCMonth() + 1) + '-' + U.pad2(d.getUTCDate()); },
  addDays: (s, n) => U.daysToYmd(U.ymdToDays(s) + n),
  mIdx: ym => (+ym.slice(0, 4)) * 12 + (+ym.slice(5, 7) - 1),
  idxM: i => Math.floor(i / 12) + '-' + U.pad2((i % 12) + 1),
  addMonths: (ym, n) => U.idxM(U.mIdx(ym) + n),
  monthRange(a, b) { const out = []; for (let i = U.mIdx(a); i <= U.mIdx(b) && out.length < 240; i++) out.push(U.idxM(i)); return out; },
  lastDay: ym => ym + '-' + U.pad2(U.dim(+ym.slice(0, 4), +ym.slice(5, 7))),
  monthLabel: ym => U.isYm(ym) ? MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4) : '—',
  monthShort: ym => U.isYm(ym) ? MONTHS[+ym.slice(5, 7) - 1].slice(0, 3) + ' ' + ym.slice(2, 4) : '—',
  /** Philippine style display, e.g. "Oct 15, 2026" — built from the string, never via Date, so no TZ shift. */
  fmtDate(s) { if (!U.isYmd(s)) return s || '—'; return MONTHS[+s.slice(5, 7) - 1].slice(0, 3) + ' ' + (+s.slice(8, 10)) + ', ' + s.slice(0, 4); },
  fmtDay(s) { if (!U.isYmd(s)) return s || '—'; const wd = WEEKDAYS[new Date(U.ymdToDays(s) * 86400000).getUTCDay()].slice(0, 3); return wd + ', ' + MONTHS[+s.slice(5, 7) - 1].slice(0, 3) + ' ' + (+s.slice(8, 10)); },
  fmtTime(iso) {
    if (!iso) return '—';
    try { return new Intl.DateTimeFormat('en-PH', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return iso; }
  },
  cents: v => (v === '' || v === null || v === undefined || !isFinite(Number(v))) ? 0 : Math.round(Number(v) * 100),
  fromCents: c => Math.round(c) / 100,
  round2: n => Math.round(Number(n) * 100) / 100,
  blank: v => v === '' || v === null || v === undefined,
  peso(n, compact) {
    if (U.blank(n) || !isFinite(Number(n))) return '—';
    const v = Number(n);
    try {
      return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', minimumFractionDigits: compact ? 0 : 2, maximumFractionDigits: compact ? 0 : 2 }).format(compact ? Math.round(v) : v);
    } catch (e) { return '₱' + v.toFixed(compact ? 0 : 2); }
  },
  parseMoney(v) {
    if (U.blank(v) || String(v).trim() === '') return '';
    const n = Number(String(v).replace(/[₱,\s]/g, ''));
    return isFinite(n) ? U.round2(n) : NaN;
  },
  hex(n) { const a = new Uint8Array(n); (self.crypto || window.crypto).getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join('').toUpperCase(); },
  uid: prefix => prefix + '-' + U.hex(8),
  opId: () => 'OP' + U.hex(10),
  esc: s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  sleep: ms => new Promise(r => setTimeout(r, ms)),
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  bool: v => v === true || String(v).toLowerCase() === 'true',
  withTimeout(p, ms, msg) {
    let t;
    return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error(msg || 'The request timed out.'), { code: 'TIMEOUT', retryable: true, network: true })), ms); })]).finally(() => clearTimeout(t));
  },
  ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
};

/* ------------------------------------------------------------------ LocalDB (IndexedDB with in-memory fallback) */
const ENTITY = {
  recurringBills: { idField: 'recurringBillId', type: 'RECURRING_BILL' },
  billInstances: { idField: 'billInstanceId', type: 'BILL_INSTANCE' },
  payments: { idField: 'paymentId', type: 'PAYMENT' },
  expenses: { idField: 'expenseId', type: 'EXPENSE' },
  income: { idField: 'incomeId', type: 'INCOME' },
  budgets: { idField: 'budgetId', type: 'BUDGET' },
  categories: { idField: 'categoryId', type: 'CATEGORY' }
};
const STORES = Object.keys(ENTITY).concat(['meta', 'queue', 'conflicts', 'dashboard', 'syncLog']);

const LocalDB = {
  db: null, memory: null, persistent: false,
  async open() {
    if (!('indexedDB' in self)) return this.useMemory('IndexedDB is not available in this browser');
    try {
      this.db = await new Promise((resolve, reject) => {
        const req = indexedDB.open('household-finances', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          Object.keys(ENTITY).forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', { keyPath: 'operationId' }).createIndex('createdAt', 'createdAt');
          if (!db.objectStoreNames.contains('conflicts')) db.createObjectStore('conflicts', { keyPath: 'operationId' });
          if (!db.objectStoreNames.contains('dashboard')) db.createObjectStore('dashboard', { keyPath: 'month' });
          if (!db.objectStoreNames.contains('syncLog')) db.createObjectStore('syncLog', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('Database upgrade blocked by another open tab.'));
      });
      this.db.onversionchange = () => { this.db.close(); location.reload(); };
      return true;
    } catch (e) {
      return this.useMemory(e.message || 'IndexedDB failed to open');
    }
  },
  useMemory(reason) {
    console.warn('LocalDB fallback to memory:', reason);
    this.memory = {}; STORES.forEach(s => { this.memory[s] = new Map(); });
    this.memoryReason = reason;
    return false;
  },
  keyOf(store, rec) { return store === 'meta' ? rec.key : store === 'queue' || store === 'conflicts' ? rec.operationId : store === 'dashboard' ? rec.month : rec.id; },
  run(store, mode, fn) {
    if (this.memory) return Promise.resolve(fn(null));
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      let result;
      Promise.resolve(fn(os)).then(r => { result = r; });
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
    });
  },
  getAll(store) {
    if (this.memory) return Promise.resolve(Array.from(this.memory[store].values()).map(x => JSON.parse(JSON.stringify(x))));
    return new Promise((resolve, reject) => {
      const req = this.db.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },
  put(store, rec) { return this.putMany(store, [rec]); },
  putMany(store, recs) {
    if (!recs.length) return Promise.resolve();
    if (this.memory) { recs.forEach(r => this.memory[store].set(this.keyOf(store, r), JSON.parse(JSON.stringify(r)))); return Promise.resolve(); }
    return this.run(store, 'readwrite', os => { recs.forEach(r => os.put(r)); });
  },
  del(store, key) {
    if (this.memory) { this.memory[store].delete(key); return Promise.resolve(); }
    return this.run(store, 'readwrite', os => { os.delete(key); });
  },
  clear(store) {
    if (this.memory) { this.memory[store].clear(); return Promise.resolve(); }
    return this.run(store, 'readwrite', os => { os.clear(); });
  },
  async addLog(entry) {
    const rec = Object.assign({ at: U.nowIso() }, entry);
    if (this.memory) { rec.id = Date.now() + Math.random(); this.memory.syncLog.set(rec.id, rec); }
    else await this.run('syncLog', 'readwrite', os => { os.add(rec); });
    Store.log.unshift(rec);
    if (Store.log.length > 200) Store.log.length = 200;
  }
};

/* ------------------------------------------------------------------ Store (in-memory mirror of IndexedDB) */
const Store = {
  data: {}, meta: {}, queue: [], conflicts: [], log: [], settings: {}, inFlight: new Set(),
  month: U.curMonth(),
  async load() {
    for (const s of Object.keys(ENTITY)) {
      this.data[s] = new Map((await LocalDB.getAll(s)).map(r => [r.id, r]));
    }
    (await LocalDB.getAll('meta')).forEach(m => { this.meta[m.key] = m.value; });
    this.queue = (await LocalDB.getAll('queue')).sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
    this.conflicts = await LocalDB.getAll('conflicts');
    this.log = (await LocalDB.getAll('syncLog')).sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 200);
    this.settings = this.meta.settings || {};
    if (!this.meta.clientId) await this.setMeta('clientId', U.uid('DEV'));
  },
  async setMeta(key, value) { this.meta[key] = value; await LocalDB.put('meta', { key, value }); },
  list(store) { return Array.from((this.data[store] || new Map()).values()); },
  get(store, id) { return (this.data[store] || new Map()).get(id) || null; },
  async save(store, rec) {
    if (!rec.id) rec.id = rec[ENTITY[store].idField];
    this.data[store].set(rec.id, rec);
    await LocalDB.put(store, rec);
    return rec;
  },
  async remove(store, id) { this.data[store].delete(id); await LocalDB.del(store, id); },
  categories(type) {
    const list = this.list('categories').filter(c => c.type === type && U.bool(c.isActive)).sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0)).map(c => c.name);
    return list.length ? list : DEFAULT_CATEGORIES[type];
  },
  pendingCount() { return this.queue.filter(o => o.status === 'PENDING' || o.status === 'RETRY').length; },
  failedCount() { return this.queue.filter(o => o.status === 'FAILED' || o.status === 'REJECTED').length; },
  reviewCount() { return this.queue.filter(o => o.status === 'NEEDS_REVIEW').length; }
};

/* ------------------------------------------------------------------ Calc (mirrors Code.gs rules exactly) */
const Calc = {
  status(expected, actual, dueDate, today, isVoid) {
    if (isVoid) return ST.VOID;
    const has = !U.blank(actual);
    const exp = U.cents(expected), act = has ? U.cents(actual) : 0;
    if (has && act > exp) return ST.OVER;
    if (has && act >= exp) return ST.PAID;
    if (dueDate && dueDate < today) return ST.OVERDUE;
    if (has && act > 0) return ST.PARTIAL;
    return ST.UNPAID;
  },
  paymentsByInstance() {
    const map = new Map();
    Store.list('payments').forEach(p => { if (!U.bool(p.isVoid)) { if (!map.has(p.billInstanceId)) map.set(p.billInstanceId, []); map.get(p.billInstanceId).push(p); } });
    return map;
  },
  /** Derived view of an instance from its (local + synced) payments. Never mutates the stored record. */
  derive(inst, payMap, today) {
    const pays = payMap.get(inst.billInstanceId) || [];
    let cents = 0, lastDate = '', lastMethod = '';
    pays.forEach(p => { cents += U.cents(p.amount); if (!lastDate || p.paymentDate >= lastDate) { lastDate = p.paymentDate; lastMethod = p.paymentMethod; } });
    const exp = U.cents(inst.expectedAmount);
    const d = Object.assign({}, inst);
    d.paymentCount = pays.length;
    d.actualAmount = pays.length ? U.fromCents(cents) : '';
    d.remainingAmount = U.fromCents(exp - (pays.length ? cents : 0));
    d.difference = pays.length ? U.fromCents(exp - cents) : '';
    d.paidDate = pays.length && cents >= exp ? lastDate : '';
    if (lastMethod) d.paymentMethod = lastMethod;
    d.isVoid = U.bool(inst.isVoid) && !pays.length;
    d.status = Calc.status(d.expectedAmount, d.actualAmount, d.dueDate, today, d.isVoid);
    d.hasLocal = pays.some(p => p.syncStatus !== 'synced') || (inst.syncStatus && inst.syncStatus !== 'synced');
    return d;
  },
  instances(today) {
    today = today || U.today();
    const payMap = Calc.paymentsByInstance();
    return Store.list('billInstances').map(i => Calc.derive(i, payMap, today));
  },
  budgetFor(month) {
    const row = Store.list('budgets').find(b => b.month === month);
    if (row && !U.blank(row.plannedAmount)) return { amount: Number(row.plannedAmount), source: 'month', row };
    const def = Number(Store.settings.defaultMonthlyBudget || 0);
    return { amount: isFinite(def) ? def : 0, source: 'default', row: null };
  },
  summary(month, instances, today) {
    today = today || U.today();
    instances = instances || Calc.instances(today);
    const c = { expectedBills: 0, actualBills: 0, paidBills: 0, unpaidBills: 0, partialBills: 0, overdueBills: 0, overBudgetAmount: 0, unpaidAmount: 0, otherExpenses: 0, expectedIncome: 0, actualIncome: 0, projected: 0 };
    const counts = { PAID: 0, PARTIAL: 0, UNPAID: 0, OVERDUE: 0, 'OVER BUDGET': 0 };
    const byCategory = {}, byBill = {};
    instances.forEach(i => {
      if (i.billingPeriod !== month || i.isVoid) return;
      const exp = U.cents(i.expectedAmount), act = U.cents(i.actualAmount);
      c.expectedBills += exp; c.actualBills += act; c.projected += Math.max(exp, act);
      if (counts[i.status] !== undefined) counts[i.status]++;
      if (i.status === ST.PAID || i.status === ST.OVER) c.paidBills += act;
      else c.unpaidAmount += Math.max(0, exp - act);
      if (i.status === ST.UNPAID) c.unpaidBills += exp;
      if (i.status === ST.PARTIAL) c.partialBills += Math.max(0, exp - act);
      if (i.status === ST.OVERDUE) c.overdueBills += Math.max(0, exp - act);
      if (act > exp) c.overBudgetAmount += act - exp;
      const cat = i.category || 'Other'; byCategory[cat] = (byCategory[cat] || 0) + act;
      const bk = i.recurringBillId || i.billName;
      if (!byBill[bk]) byBill[bk] = { name: i.billName, expected: 0, actual: 0 };
      byBill[bk].expected += exp; byBill[bk].actual += act;
    });
    Store.list('expenses').forEach(e => {
      if (U.bool(e.isDeleted) || String(e.date).slice(0, 7) !== month) return;
      const a = U.cents(e.amount); c.otherExpenses += a;
      const cat = e.category || 'Other'; byCategory[cat] = (byCategory[cat] || 0) + a;
    });
    Store.list('income').forEach(r => {
      if (U.bool(r.isDeleted) || r.status === 'CANCELLED' || String(r.date).slice(0, 7) !== month) return;
      c.expectedIncome += U.cents(r.expectedAmount); c.actualIncome += U.cents(r.actualAmount);
    });
    const planned = Calc.budgetFor(month);
    const budgetCents = Math.round(planned.amount * 100);
    const totalSpent = c.actualBills + c.otherExpenses;
    const f = U.fromCents;
    const s = {
      month, monthlyBudget: f(budgetCents), budgetSource: planned.source,
      expectedBills: f(c.expectedBills), actualBills: f(c.actualBills), paidBills: f(c.paidBills), unpaidBills: f(c.unpaidBills),
      partialBills: f(c.partialBills), overdueBills: f(c.overdueBills), overBudgetBills: f(c.overBudgetAmount),
      unpaidAmount: f(c.unpaidAmount), overBudgetAmount: f(c.overBudgetAmount), otherExpenses: f(c.otherExpenses),
      expectedIncome: f(c.expectedIncome), actualIncome: f(c.actualIncome), totalMoneyIn: f(c.actualIncome), totalMoneyOut: f(totalSpent),
      totalSpent: f(totalSpent), projectedSpend: f(c.projected + c.otherExpenses), remaining: f(budgetCents - totalSpent),
      netCashFlow: f(c.actualIncome - c.actualBills - c.otherExpenses), counts,
      byCategory: Object.keys(byCategory).map(k => ({ category: k, amount: f(byCategory[k]) })).filter(x => x.amount > 0).sort((a, b) => b.amount - a.amount),
      byBill: Object.keys(byBill).map(k => ({ name: byBill[k].name, expected: f(byBill[k].expected), actual: f(byBill[k].actual) })).sort((a, b) => b.expected - a.expected)
    };
    s.budget = Calc.budget(s, today, Number(Store.settings.watchThreshold || 0.9));
    return s;
  },
  budget(s, today, watch) {
    const budget = s.monthlyBudget, reasons = [];
    let health = 'ON TRACK';
    const basis = budget > 0 ? budget : s.expectedBills;
    const used = basis > 0 ? s.totalSpent / basis : (s.totalSpent > 0 ? 1 : 0);
    const cm = today.slice(0, 7);
    const elapsed = s.month < cm ? 1 : s.month > cm ? 0 : (+today.slice(8, 10)) / U.dim(+cm.slice(0, 4), +cm.slice(5, 7));
    const P = n => U.peso(n);
    if (basis > 0 && s.totalSpent > basis) { health = 'OVER BUDGET'; reasons.push('Spending exceeds the budget by ' + P(s.totalSpent - basis) + '.'); }
    else {
      if (basis > 0 && s.projectedSpend > basis) reasons.push('Projected spending ' + P(s.projectedSpend) + ' exceeds the budget by ' + P(s.projectedSpend - basis) + '.');
      if (basis > 0 && used >= (watch || 0.9)) reasons.push(Math.round(used * 100) + '% of the budget is already used.');
      if (s.counts.OVERDUE > 0) reasons.push(s.counts.OVERDUE + ' overdue bill' + (s.counts.OVERDUE > 1 ? 's' : '') + ' (' + P(s.overdueBills) + ' outstanding).');
      if (s.counts['OVER BUDGET'] > 0) reasons.push(s.counts['OVER BUDGET'] + ' bill' + (s.counts['OVER BUDGET'] > 1 ? 's' : '') + ' paid above the expected amount (+' + P(s.overBudgetAmount) + ').');
      if (basis > 0 && elapsed > 0 && elapsed < 1 && used > elapsed + 0.15 && used < (watch || 0.9)) reasons.push('Spending pace (' + Math.round(used * 100) + '% used) is ahead of the month (' + Math.round(elapsed * 100) + '% elapsed).');
      if (s.expectedIncome > 0 && s.projectedSpend > s.expectedIncome) reasons.push('Expected income ' + P(s.expectedIncome) + ' does not cover projected spending.');
      if (reasons.length) health = 'WATCH';
    }
    return { health, reasons, budget, basis: U.round2(basis), totalSpent: s.totalSpent, projectedSpend: s.projectedSpend, remaining: U.round2(basis - s.totalSpent), percentUsed: U.round2(used * 100), percentProjected: basis > 0 ? U.round2(s.projectedSpend / basis * 100) : 0, monthElapsed: U.round2(elapsed * 100) };
  },
  upcoming(month, instances, today) {
    const cm = today.slice(0, 7);
    const horizon = U.addDays(today, 30);
    return instances.filter(i => !i.isVoid && i.status !== ST.PAID && i.status !== ST.OVER && i.status !== ST.OVERDUE &&
      (month === cm ? (i.dueDate >= today && i.dueDate <= horizon) : i.billingPeriod === month))
      .sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0)).slice(0, 12);
  },
  attention(month, instances, today) {
    const end = U.lastDay(month), soon = U.addDays(today, 7);
    const rank = { 'OVERDUE': 0, 'OVER BUDGET': 1, 'PARTIAL': 2, 'UNPAID': 3 };
    return instances.filter(i => {
      if (i.isVoid) return false;
      if (i.status === ST.OVERDUE) return i.dueDate <= end;
      if (i.billingPeriod !== month) return false;
      return i.status === ST.OVER || i.status === ST.PARTIAL || (i.status === ST.UNPAID && i.dueDate <= soon);
    }).sort((a, b) => (rank[a.status] - rank[b.status]) || (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0)).slice(0, 20);
  },
  scheduleText(b) {
    switch (b.frequency) {
      case 'MONTHLY': return 'Monthly · due the ' + U.ordinal(+b.dueDay || 1);
      case 'WEEKLY': return 'Weekly · every ' + (WEEKDAYS[+b.dueWeekday] || '—');
      case 'QUARTERLY': return 'Quarterly · the ' + U.ordinal(+b.dueDay || 1);
      case 'YEARLY': return 'Yearly · ' + (U.isYmd(b.startDate) ? MONTHS[+b.startDate.slice(5, 7) - 1].slice(0, 3) + ' ' + (+b.dueDay || 1) : '');
      case 'CUSTOM': return 'Every ' + (b.intervalDays || '?') + ' days';
      default: return b.frequency || '—';
    }
  },
  monthlyEquivalent(b) {
    const a = Number(b.amount) || 0;
    return { WEEKLY: a * 52 / 12, MONTHLY: a, QUARTERLY: a / 3, YEARLY: a / 12, CUSTOM: a * (365.25 / 12) / Math.max(1, +b.intervalDays || 30) }[b.frequency] || 0;
  }
};

/* ------------------------------------------------------------------ Api */
class ApiError extends Error {
  constructor(message, code, retryable, network) { super(message); this.code = code; this.retryable = retryable; this.network = network; }
}
const Api = {
  configured() { return IS_GAS || (!!Store.meta.apiUrl && !!Store.meta.apiKey); },
  async call(action, payload, opts) {
    opts = opts || {};
    const body = { action, apiKey: Store.meta.apiKey || '', payload: payload || {} };
    let res;
    if (IS_GAS) {
      res = await U.withTimeout(new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(s => { try { resolve(JSON.parse(s)); } catch (e) { reject(new ApiError('Invalid server response.', 'BAD_RESPONSE', true)); } })
          .withFailureHandler(err => reject(new ApiError((err && err.message) || 'Network error', 'NETWORK', true, true)))
          .handleClientRequest(JSON.stringify(body));
      }), opts.timeout || REQUEST_TIMEOUT_MS);
    } else {
      if (!Store.meta.apiUrl) throw new ApiError('The app is not connected yet. Open Settings → Connection.', 'NOT_CONFIGURED', false);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), opts.timeout || REQUEST_TIMEOUT_MS);
      try {
        const r = await fetch(Store.meta.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctrl.signal, cache: 'no-store', credentials: 'omit' });
        const text = await r.text();
        try { res = JSON.parse(text); } catch (e) {
          throw new ApiError(/<html/i.test(text) ? 'The server returned a web page instead of data. Check the Web App URL (must end in /exec) and that access is set to "Anyone".' : 'Invalid server response.', 'BAD_RESPONSE', true);
        }
      } catch (e) {
        if (e instanceof ApiError) throw e;
        if (e.name === 'AbortError') throw new ApiError('The server took too long to respond.', 'TIMEOUT', true, true);
        throw new ApiError('Cannot reach the server (' + (e.message || 'network error') + ').', 'NETWORK', true, true);
      } finally { clearTimeout(timer); }
    }
    if (!res || typeof res !== 'object') throw new ApiError('Invalid server response.', 'BAD_RESPONSE', true);
    if (!res.ok) throw new ApiError(res.error && res.error.message || 'Server error', res.error && res.error.code || 'SERVER_ERROR', !!(res.error && res.error.retryable));
    Sync.lastServerContact = Date.now();
    Sync.reachable = true;
    return res.data;
  }
};

/* ------------------------------------------------------------------ Sync engine */
const Sync = {
  running: null, reachable: navigator.onLine, lastServerContact: 0, lastError: '', justCompleted: 0, timer: null,
  online() { return navigator.onLine && this.reachable !== false; },

  /** Writes an operation durably to the IndexedDB queue BEFORE any network attempt. */
  async enqueue(op) {
    op = Object.assign({ operationId: U.opId(), createdAt: U.nowIso(), clientUpdatedAt: U.nowIso(), status: 'PENDING', retryCount: 0, nextAttemptAt: 0, lastError: '' }, op);
    const existing = Store.queue.findIndex(q => q.operationId === op.operationId);
    if (existing >= 0) return Store.queue[existing];          // same operationId = same intent (double click)
    Store.queue.push(op);
    await LocalDB.put('queue', op);
    UI.updateStatus();
    return op;
  },
  async updateOp(op) { await LocalDB.put('queue', op); },
  async removeOp(opId) {
    Store.queue = Store.queue.filter(q => q.operationId !== opId);
    await LocalDB.del('queue', opId);
  },
  isQueued(opId) { return Store.queue.some(q => q.operationId === opId); },

  /** Runs one sync cycle: push queued operations, then pull server changes. Concurrent callers share the same run. */
  run(opts) {
    if (this.running) return this.running;
    this.running = this._run(opts || {}).finally(() => { this.running = null; UI.updateStatus(); });
    UI.updateStatus();
    return this.running;
  },
  async _run(opts) {
    if (!Api.configured()) return { skipped: 'not-configured' };
    if (!navigator.onLine) { this.reachable = false; return { skipped: 'offline' }; }
    let pushed = 0, failed = 0, conflicts = 0;
    try {
      const now = Date.now();
      const ready = Store.queue.filter(o => (o.status === 'PENDING' || o.status === 'RETRY' || o.status === 'FAILED' || (opts.manual && o.status === 'REJECTED')) && (opts.manual || !o.nextAttemptAt || o.nextAttemptAt <= now));
      for (let i = 0; i < ready.length; i += SYNC_BATCH) {
        const chunk = ready.slice(i, i + SYNC_BATCH);
        chunk.forEach(o => Store.inFlight.add(o.operationId));
        let result;
        try {
          result = await Api.call('syncOfflineOperations', { clientId: Store.meta.clientId, operations: chunk.map(o => this.wire(o)) }, { timeout: 45000 });
        } catch (e) {
          chunk.forEach(o => Store.inFlight.delete(o.operationId));
          if (e.network) this.reachable = false;
          for (const o of chunk) await this.markRetry(o, e.message, e.retryable !== false);
          throw e;
        }
        for (const r of result.results) {
          const op = chunk.find(o => o.operationId === r.operationId);
          Store.inFlight.delete(r.operationId);
          if (!op) continue;
          const outcome = await this.applyResult(op, r);
          if (outcome === 'ok') pushed++; else if (outcome === 'review') conflicts++; else failed++;
        }
      }
      await this.pull({ month: opts.month, full: opts.full });
      this.lastError = '';
      if (pushed) await LocalDB.addLog({ type: 'SYNCED', message: pushed + ' change' + (pushed > 1 ? 's' : '') + ' synchronized' });
      if (!Store.queue.length) this.justCompleted = Date.now();
      return { pushed, failed, conflicts };
    } catch (e) {
      this.lastError = e.message;
      if (!e.network) await LocalDB.addLog({ type: 'SYNC_ERROR', message: e.message });
      return { error: e.message, network: !!e.network, pushed, failed, conflicts };
    } finally {
      UI.refresh();
    }
  },
  wire(o) {
    const w = { operationId: o.operationId, entityType: o.entityType, action: o.action, localId: o.localId, payload: o.payload, createdAt: o.createdAt, clientUpdatedAt: o.clientUpdatedAt };
    if (o.baseUpdatedAt) w.baseUpdatedAt = o.baseUpdatedAt;
    if (o.baseValues) w.baseValues = o.baseValues;
    if (o.changedFields) w.changedFields = o.changedFields;
    if (o.force) w.force = true;
    return w;
  },
  async markRetry(o, message, retryable) {
    o.retryCount = (o.retryCount || 0) + 1;
    o.lastError = message;
    if (retryable) {
      o.status = o.retryCount >= 5 ? 'FAILED' : 'RETRY';
      o.nextAttemptAt = Date.now() + Math.min(10 * 60 * 1000, 5000 * Math.pow(2, o.retryCount - 1));
    } else {
      o.status = 'REJECTED';
    }
    await this.updateOp(o);
    await this.markEntity(o, o.status === 'REJECTED' ? 'failed' : 'pending');
  },
  async markEntity(o, syncStatus) {
    const store = Object.keys(ENTITY).find(s => ENTITY[s].type === o.entityType);
    if (!store) return;
    const rec = Store.get(store, o.localId || o.entityId);
    if (rec) { rec.syncStatus = syncStatus; rec.syncError = syncStatus === 'failed' ? o.lastError : ''; await Store.save(store, rec); }
  },
  async applyResult(op, r) {
    if (r.status === 'SUCCESS' || r.status === 'DUPLICATE' || r.status === 'CONFLICT_RESOLVED') {
      await this.removeOp(op.operationId);
      if (r.serverId && op.localId && r.serverId !== op.localId) await this.remapId(op.entityType, op.localId, r.serverId);
      await this.mergeRecords(r.records || {}, true);
      if (r.status === 'CONFLICT_RESOLVED') await LocalDB.addLog({ type: 'CONFLICT_RESOLVED', message: r.message, operationId: op.operationId });
      return 'ok';
    }
    if (r.status === 'NEEDS_REVIEW') {
      op.status = 'NEEDS_REVIEW'; op.lastError = r.message;
      await this.updateOp(op);
      const c = { operationId: op.operationId, entityType: op.entityType, entityId: op.localId || op.entityId, message: r.message, conflict: r.conflict || null, op, at: U.nowIso() };
      Store.conflicts = Store.conflicts.filter(x => x.operationId !== op.operationId).concat([c]);
      await LocalDB.put('conflicts', c);
      await this.markEntity(op, 'conflict');
      await LocalDB.addLog({ type: 'CONFLICT', message: r.message, operationId: op.operationId });
      return 'review';
    }
    await this.markRetry(op, r.message || 'Sync failed', r.retryable !== false);
    await LocalDB.addLog({ type: 'FAILED', message: (r.message || 'Sync failed') + (r.retryable === false ? '' : ' — will retry'), operationId: op.operationId });
    return 'failed';
  },
  async remapId(entityType, oldId, newId) {
    const store = Object.keys(ENTITY).find(s => ENTITY[s].type === entityType);
    if (!store) return;
    const rec = Store.get(store, oldId);
    if (rec) { await Store.remove(store, oldId); rec.id = newId; rec[ENTITY[store].idField] = newId; rec.serverId = newId; await Store.save(store, rec); }
    for (const q of Store.queue) {
      let changed = false;
      if (q.localId === oldId) { q.localId = newId; changed = true; }
      if (q.entityId === oldId) { q.entityId = newId; changed = true; }
      if (q.payload && q.payload[ENTITY[store].idField] === oldId) { q.payload[ENTITY[store].idField] = newId; changed = true; }
      if (changed) await this.updateOp(q);
    }
  },
  /** Merge server records. Local records with unsynced edits are kept (their queued ops will win or conflict on the server). */
  async mergeRecords(recs, fromOwnOp) {
    const now = U.nowIso();
    const pendingIds = new Set(Store.queue.map(q => q.localId || q.entityId).filter(Boolean));
    for (const store of Object.keys(ENTITY)) {
      const list = recs[store];
      if (!Array.isArray(list) || !list.length) continue;
      const out = [];
      for (const r of list) {
        if (!r) continue;
        const id = r[ENTITY[store].idField];
        if (!id) continue;
        const local = Store.get(store, id);
        if (local && pendingIds.has(id)) {
          // a queued change for this record is still waiting — keep local content, refresh the server baseline only
          local.serverUpdatedAt = r.updatedAt; local.serverId = id;
          out.push(local); continue;
        }
        out.push(Object.assign({}, r, { id, localId: local ? local.localId || id : id, serverId: id, syncStatus: 'synced', syncError: '', serverUpdatedAt: r.updatedAt, lastSyncedAt: now }));
      }
      out.forEach(r => Store.data[store].set(r.id, r));
      await LocalDB.putMany(store, out);
    }
    if (recs.settings && typeof recs.settings === 'object' && !Array.isArray(recs.settings)) { Store.settings = recs.settings; await Store.setMeta('settings', recs.settings); }
  },
  async pull(opts) {
    opts = opts || {};
    const full = opts.full || !Store.meta.lastServerTime;
    let since = '';
    if (!full) { const t = new Date(new Date(Store.meta.lastServerTime).getTime() - 5 * 60 * 1000); since = t.toISOString(); }
    const data = await Api.call('getAllData', { since, month: opts.month || Store.month }, { timeout: 45000 });
    await this.mergeRecords({ recurringBills: data.recurringBills, billInstances: data.billInstances, payments: data.payments, expenses: data.expenses, income: data.income, budgets: data.budgets, categories: data.categories, settings: data.settings }, false);
    if (data.full) {
      // Full refresh: remove synced local records that no longer exist on the server
      const pendingIds = new Set(Store.queue.map(q => q.localId || q.entityId));
      const map = { recurringBills: data.recurringBills, billInstances: data.billInstances, payments: data.payments, expenses: data.expenses, income: data.income, budgets: data.budgets, categories: data.categories };
      for (const store of Object.keys(map)) {
        const ids = new Set((map[store] || []).map(r => r[ENTITY[store].idField]));
        for (const rec of Store.list(store)) if (!ids.has(rec.id) && rec.syncStatus === 'synced' && !pendingIds.has(rec.id)) await Store.remove(store, rec.id);
      }
    }
    await Store.setMeta('lastServerTime', data.serverTime);
    await Store.setMeta('lastSyncAt', U.nowIso());
    if (data.today) Store.serverToday = data.today;
    return data;
  },
  schedule(ms) {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), ms || 0);
  },
  start() {
    window.addEventListener('online', () => { this.reachable = true; UI.updateStatus(); UI.toast('Back online. Synchronizing…'); this.run(); });
    window.addEventListener('offline', () => { this.reachable = false; UI.updateStatus(); UI.refresh(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.run(); });
    setInterval(() => {
      if (!Api.configured()) return;
      const due = Store.queue.some(o => (o.status === 'PENDING' || o.status === 'RETRY') && (!o.nextAttemptAt || o.nextAttemptAt <= Date.now()));
      const stale = Date.now() - this.lastServerContact > 5 * 60 * 1000;
      if (navigator.onLine && (due || stale || this.reachable === false)) this.run();
    }, 20000);
    this.run();
  },
  /**
   * Save path used by every form: the operation is persisted locally first, then (if online)
   * pushed immediately. Returns 'synced' | 'local' | 'review' | 'rejected'.
   */
  async commit(op) {
    await this.enqueue(op);
    UI.refresh();
    if (!Api.configured() || !navigator.onLine) return 'local';
    try { await U.withTimeout(this.run(), 20000, 'Still syncing in the background.'); } catch (e) { return 'local'; }
    const q = Store.queue.find(x => x.operationId === op.operationId);
    if (!q) return 'synced';
    if (q.status === 'NEEDS_REVIEW') return 'review';
    if (q.status === 'REJECTED') { this.lastRejection = q.lastError; return 'rejected'; }
    return 'local';
  }
};

    this.go(this.view || this.hashView() || 'dashboard');
  },
  /** Reads the view from the URL hash; returns '' when the hash is unavailable (e.g. sandboxed previews). */
  hashView() {
    try { const id = (location.hash || '').replace(/^#\/?/, '').split('?')[0]; return VIEWS.some(v => v.id === id) ? id : ''; } catch (e) { return ''; }
  },
  /** Navigates without depending on the History API, so the app also works inside iframes / srcdoc previews. */
  go(view) {
    if (!VIEWS.some(v => v.id === view)) view = 'dashboard';
    this.route(view);
    try { if (location.hash !== '#/' + view) location.hash = '#/' + view; } catch (e) { /* URL not writable here — in-memory routing still works */ }
  },
  route(view) {
    const id = view || this.hashView() || this.view || 'dashboard';
    this.view = VIEWS.some(v => v.id === id) ? id : 'dashboard';
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === this.view || (a.dataset.nav === 'more' && !['dashboard', 'bills', 'expenses', 'income'].includes(this.view))));
    document.getElementById('pageTitle').textContent = VIEWS.find(v => v.id === this.view).label;
    document.getElementById('monthSel').style.visibility = MONTH_VIEWS.includes(this.view) ? 'visible' : 'hidden';
    Modal.close();
    this.render();
    document.getElementById('view').scrollTop = 0;
    window.scrollTo(0, 0);
  },
  setMonth(ym) {
    Store.month = ym;
    this.render();
    const has = Store.list('billInstances').some(i => i.billingPeriod === ym);
    if (!has && Api.configured() && navigator.onLine && U.mIdx(ym) <= U.mIdx(U.curMonth()) + 24) Sync.run({ month: ym });
  },
  render() {
    document.getElementById('monthLabel').textContent = U.monthLabel(Store.month);
    document.getElementById('monthInput').value = Store.month;
    const el = document.getElementById('view');
    const fn = Views[this.view];
    try {
      el.innerHTML = fn ? fn.call(Views) : '';
    } catch (e) {
      console.error(e);
      el.innerHTML = `<div class="banner err">Something went wrong rendering this page: ${U.esc(e.message)}</div>`;
    }
    Charts.drawAll();
    this.updateStatus();
  },
  /** Re-render after data changes without stealing focus from a filter the user is typing in. */
  refresh() {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#view .filters')) { const lb = document.getElementById('listBody'); if (lb && Views[this.view + 'List']) { lb.innerHTML = Views[this.view + 'List'](); this.updateStatus(); return; } }
    this.render();
  },
  status() {
    const pending = Store.pendingCount(), failed = Store.failedCount(), review = Store.reviewCount();
    if (Sync.running) return { state: 'syncing', text: 'Syncing…' };
    if (!navigator.onLine || Sync.reachable === false) return { state: 'offline', text: pending ? 'Offline • Saved locally' : 'Offline' };
    if (!Api.configured()) return { state: 'pending', text: '⚠ Not connected' };
    if (failed || review) return { state: 'failed', text: review ? '⚠ Needs review' : '⚠ Sync failed' };
    if (pending) return { state: 'pending', text: '⚠ Sync pending' };
    if (Date.now() - Sync.justCompleted < 4000) return { state: 'complete', text: '✓ All changes synced' };
    return { state: 'online', text: 'Online • Synced' };
  },
  updateStatus() {
    const s = this.status();
    ['connTop', 'connSide'].forEach(id => { const el = document.getElementById(id); if (!el) return; el.dataset.state = s.state; el.querySelector('.txt').textContent = s.text; el.title = s.text + (Store.meta.lastSyncAt ? ' — last synced ' + U.fmtTime(Store.meta.lastSyncAt) : ''); });
    const n = Store.queue.length;
    document.querySelectorAll('[data-badge="sync"],[data-badge="more"]').forEach(b => { b.hidden = !n; b.textContent = n; });
    const today = U.today();
    const overdue = Calc.instances(today).filter(i => i.status === ST.OVERDUE).length;
    document.querySelectorAll('[data-badge="bills"]').forEach(b => { b.hidden = !overdue; b.textContent = overdue; });
    if (this._completeTimer) clearTimeout(this._completeTimer);
    if (s.state === 'complete') this._completeTimer = setTimeout(() => this.updateStatus(), 4100);
  },
  toast(message, kind, ms) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.innerHTML = `<span>${U.esc(message)}</span><button class="x" aria-label="Dismiss">×</button>`;
    t.querySelector('.x').onclick = () => t.remove();
    box.appendChild(t);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => t.remove(), ms || (kind === 'err' ? 7000 : 4000));
  },
  /** Disables a button, shows a label + spinner, and always restores it. */
  async busy(btn, label, fn) {
    if (btn && btn.dataset.busy === '1') return;
    const orig = btn ? btn.innerHTML : '';
    if (btn) { btn.dataset.busy = '1'; btn.disabled = true; btn.classList.add('busy'); btn.innerHTML = `<span class="spinner"></span>${U.esc(label || 'Saving…')}`; }
    try { return await fn(); }
    finally { if (btn && btn.isConnected) { btn.dataset.busy = ''; btn.disabled = false; btn.classList.remove('busy'); btn.innerHTML = orig; } }
  },
  saveOutcome(outcome, noun) {
    if (outcome === 'synced') this.toast(noun + ' saved.');
    else if (outcome === 'review') this.toast(noun + ' changed on another device too. Review it in Sync / Offline.', 'warn', 7000);
    else if (outcome === 'rejected') this.toast('Server rejected this change: ' + (Sync.lastRejection || 'invalid data') + '. See Sync / Offline.', 'err');
    else this.toast(noun + " saved locally. It will sync when you're online.");
  },
  onClick(e) {
    const link = e.target.closest('a[href^="#/"]');
    if (link) { e.preventDefault(); Modal.close(); this.go(link.getAttribute('href').slice(2)); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = Actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  },
  onInput(e) {
    const f = e.target.closest('[data-filter]');
    if (!f) return;
    const [view, key] = f.dataset.filter.split('.');
    this.filters[view][key] = f.type === 'checkbox' ? f.checked : f.value;
    const lb = document.getElementById('listBody');
    if (lb && Views[view + 'List']) lb.innerHTML = Views[view + 'List']();
  },
  onChange(e) {
    if (e.target.matches('select[data-filter], input[type=date][data-filter], input[type=checkbox][data-filter], input[type=month][data-filter]')) this.onInput(e);
  },
  cachedBanner() {
    const off = !navigator.onLine || Sync.reachable === false;
    const never = !Store.meta.lastSyncAt;
    if (!Api.configured()) {
      return `<div class="banner warn"><span class="grow"><b>Not connected to Google Sheets yet.</b> Entries are saved on this device and will sync after you connect.</span><a class="btn sm" href="#/settings">Connect</a></div>`;
    }
    if (off) return `<div class="banner"><span class="grow"><b>Showing locally cached data.</b> ${never ? 'No data has been downloaded yet.' : 'Last synced ' + U.fmtTime(Store.meta.lastSyncAt) + '.'} Changes are saved on this device and will sync automatically.</span></div>`;
    if (Sync.lastError && !Sync.running) return `<div class="banner err"><span class="grow"><b>Sync problem:</b> ${U.esc(Sync.lastError)} Showing locally cached data.</span><button class="btn sm" data-action="sync-now">Retry</button></div>`;
    return '';
  },
  options(list, selected, placeholder) {
    return (placeholder !== undefined ? `<option value="">${U.esc(placeholder)}</option>` : '') + list.map(v => { const val = typeof v === 'object' ? v.value : v; const lab = typeof v === 'object' ? v.label : v; return `<option value="${U.esc(val)}" ${String(val) === String(selected) ? 'selected' : ''}>${U.esc(lab)}</option>`; }).join('');
  }
};

const tagFor = st => `<span class="tag ${st === 'OVER BUDGET' ? 'OVER' : U.esc(st)}">${U.esc(st)}</span>`;
const localTag = r => r && r.syncStatus && r.syncStatus !== 'synced' ? `<span class="tag local" title="${U.esc(r.syncError || 'Not yet synced to Google Sheets')}">${r.syncStatus === 'failed' ? 'Sync failed' : r.syncStatus === 'conflict' ? 'Needs review' : 'Saved locally'}</span>` : '';

/* ------------------------------------------------------------------ Tooltip */
const Tooltip = {
  el: null, hideTimer: null,
  init() {
    this.el = document.getElementById('tooltip');
    document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) this.show(t.dataset.tip, e); });
    document.addEventListener('mousemove', e => { if (this.el.classList.contains('show')) this.place(e); });
    document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) this.hide(); });
    document.addEventListener('touchstart', e => { const t = e.target.closest('[data-tip]'); if (t) { const p = e.touches[0]; this.show(t.dataset.tip, p); clearTimeout(this.hideTimer); this.hideTimer = setTimeout(() => this.hide(), 2500); } }, { passive: true });
  },
  show(text, e) { this.el.textContent = text; this.el.classList.add('show'); this.place(e); },
  place(e) {
    const w = this.el.offsetWidth, h = this.el.offsetHeight;
    let x = e.clientX + 14, y = e.clientY - h - 12;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y < 8) y = e.clientY + 18;
    this.el.style.left = Math.max(8, x) + 'px'; this.el.style.top = y + 'px';
  },
  hide() { this.el.classList.remove('show'); }
};

/* ------------------------------------------------------------------ Charts (hand-built SVG, sized to the container) */
const Charts = {
  pending: {},
  css: v => getComputedStyle(document.documentElement).getPropertyValue(v).trim(),
  drawAll() {
    document.querySelectorAll('[data-chart]').forEach(el => {
      const spec = this.pending[el.dataset.chart];
      if (!spec) return;
      const w = Math.max(260, el.clientWidth - (parseFloat(getComputedStyle(el).paddingLeft) + parseFloat(getComputedStyle(el).paddingRight)));
      try { el.innerHTML = spec.draw(w); } catch (e) { el.innerHTML = '<div class="empty">Chart unavailable</div>'; console.error(e); }
    });
  },
  register(id, draw) { this.pending[id] = { draw }; return `<div class="chart" data-chart="${id}"></div>`; },
  niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; },
  compact(v) { if (Math.abs(v) >= 1e6) return '₱' + U.round2(v / 1e6) + 'M'; if (Math.abs(v) >= 1000) return '₱' + Math.round(v / 100) / 10 + 'k'; return '₱' + Math.round(v); },
  trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; },
  empty(msg) { return `<div class="empty" style="padding:28px 0">${U.esc(msg)}</div>`; },

  expectedVsActual(rows) {
    return w => {
      if (!rows.length) return this.empty('No bills for this month.');
      const labelW = Math.min(130, w * 0.32), valW = 74, plotW = w - labelW - valW, rowH = 34;
      const max = this.niceMax(Math.max(...rows.map(r => Math.max(r.expected, r.actual))));
      const h = rows.length * rowH + 8;
      const ce = this.css('--c-expected'), ca = this.css('--c-actual');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Expected versus actual spending by bill">`;
      rows.forEach((r, i) => {
        const y = i * rowH + 4;
        const we = Math.max(r.expected > 0 ? 2 : 0, r.expected / max * plotW), wa = Math.max(r.actual > 0 ? 2 : 0, r.actual / max * plotW);
        const tip = `${r.name}\nExpected ${U.peso(r.expected)}\nActual ${r.actual ? U.peso(r.actual) : '— (not paid)'}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="0" y="${y - 2}" width="${w}" height="${rowH - 2}" fill="transparent"/>`;
        s += `<text x="0" y="${y + 17}" style="font-weight:600;fill:${this.css('--ink')}">${U.esc(this.trunc(r.name, Math.floor(labelW / 7)))}</text>`;
        s += `<rect x="${labelW}" y="${y + 3}" width="${we}" height="9" rx="3" fill="${ce}"/>`;
        s += `<rect x="${labelW}" y="${y + 15}" width="${wa}" height="9" rx="3" fill="${ca}"/>`;
        s += `<text x="${w}" y="${y + 23}" text-anchor="end" style="font-variant-numeric:tabular-nums">${r.actual ? U.peso(r.actual, true) : '—'}</text></g>`;
      });
      return s + '</svg>';
    };
  },
  incomeVsOut(trend) {
    return w => {
      const h = 220, padL = 52, padB = 26, padT = 10, plotW = w - padL - 4, plotH = h - padB - padT;
      const max = this.niceMax(Math.max(1, ...trend.map(t => Math.max(t.actualIncome, t.totalSpent))));
      const ci = this.css('--c-income'), co = this.css('--c-out');
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Income versus money out, last six months">`;
      for (let k = 0; k <= 4; k++) {
        const y = padT + plotH - plotH * k / 4;
        s += `<line class="grid" x1="${padL}" x2="${w}" y1="${y}" y2="${y}"/><text x="${padL - 8}" y="${y + 4}" text-anchor="end">${this.compact(max * k / 4)}</text>`;
      }
      const group = plotW / trend.length, bw = Math.min(22, (group - 14) / 2);
      trend.forEach((t, i) => {
        const cx = padL + group * i + group / 2;
        const hi = t.actualIncome / max * plotH, ho = t.totalSpent / max * plotH;
        const tip = `${U.monthLabel(t.month)}\nIncome received ${U.peso(t.actualIncome)}\nMoney out ${U.peso(t.totalSpent)}\nNet ${U.peso(t.actualIncome - t.totalSpent)}`;
        s += `<g data-tip="${U.esc(tip)}"><rect x="${cx - group / 2}" y="${padT}" width="${group}" height="${plotH}" fill="transparent"/>`;
        s += `<rect x="${cx - bw - 1}" y="${padT + plotH - hi}" width="${bw}" height="${Math.max(0, hi)}" rx="3" fill="${ci}"/>`;
        s += `<rect x="${cx + 1}" y="${padT + plotH - ho}" width="${bw}" height="${Math.max(0, ho)}" rx="3" fill="${co}"/>`;
        s += `<text x="${cx}" y="${h - 8}" text-anchor="middle" style="${t.month === Store.month ? 'font-weight:700;fill:' + this.css('--ink') : ''}">${U.monthShort(t.month)}</text></g>`;
      });
      s += `<line class="axis" x1="${padL}" x2="${w}" y1="${padT + plotH}" y2="${padT + plotH}"/>`;
      return s + '</svg>';
    };
  },
  categories(rows) {
    return w => {
      if (!rows.length) return this.empty('No spending recorded this month yet.');
      let list = rows.slice(0, 7);
      if (rows.length > 7) list.push({ category: 'All other', amount: rows.slice(7).reduce((a, b) => a + b.amount, 0) });
      const total = rows.reduce((a, b) => a + b.amount, 0);
      const labelW = Math.min(120, w * 0.3), valW = 92, plotW = w - labelW - valW, rowH = 28;
      const max = Math.max(...list.map(r => r.amount));
      const h = list.length * rowH;
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Spending by category">`;
      list.forEach((r, i) => {
        const y = i * rowH;
        const bw = Math.max(2, r.amount / max * plotW);
        s += `<g data-tip="${U.esc(r.category + '\n' + U.peso(r.amount) + ' · ' + Math.round(r.amount / total * 100) + '% of spending')}"><rect x="0" y="${y}" width="${w}" height="${rowH}" fill="transparent"/>`;
        s += `<text x="0" y="${y + 17}">${U.esc(this.trunc(r.category, Math.floor(labelW / 6.5)))}</text>`;
        s += `<rect x="${labelW}" y="${y + 8}" width="${bw}" height="11" rx="3" fill="${this.css('--ink')}"/>`;
        s += `<text x="${w}" y="${y + 17}" text-anchor="end" style="font-variant-numeric:tabular-nums;fill:${this.css('--ink')}">${U.peso(r.amount, true)}</text></g>`;
      });
      return s + '</svg>';
    };
  },
  status(counts) {
    const order = [['PAID', '--paid', 'Paid'], ['PARTIAL', '--partial', 'Partial'], ['UNPAID', '--unpaid', 'Unpaid'], ['OVERDUE', '--overdue', 'Overdue'], ['OVER BUDGET', '--over', 'Over budget']];
    return w => {
      const total = order.reduce((a, o) => a + (counts[o[0]] || 0), 0);
      if (!total) return this.empty('No bills for this month.');
      const h = 22; let x = 0;
      let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bill payment status">`;
      const segs = order.filter(o => counts[o[0]]);
      const gaps = (segs.length - 1) * 2, avail = w - gaps;
      segs.forEach((o, i) => {
        const sw = counts[o[0]] / total * avail;
        s += `<rect data-tip="${U.esc(o[2] + ': ' + counts[o[0]] + ' bill' + (counts[o[0]] > 1 ? 's' : ''))}" x="${x}" y="0" width="${Math.max(1, sw)}" height="${h}" rx="4" fill="${this.css(o[1])}"/>`;
        x += sw + 2;
      });
      s += '</svg>';
      s += `<div class="legend" style="padding:14px 0 0">${order.map(o => `<span><i style="background:var(${o[1]})"></i>${o[2]} <b>${counts[o[0]] || 0}</b></span>`).join('')}</div>`;
      return s;
    };
  }
};

/* ------------------------------------------------------------------ Views */

    const s = Calc.summary(Store.month, inst, today);
    const b = s.budget;
    const scheduled = inst.filter(i => i.billingPeriod === Store.month && !i.isVoid).length;
    const unpaidN = s.counts.UNPAID + s.counts.PARTIAL + s.counts.OVERDUE;
    const incomePct = s.expectedIncome > 0 ? Math.round(s.actualIncome / s.expectedIncome * 100) : null;

        ${kpi('Remaining', s.remaining, s.remaining < 0 ? 'Over the planned budget' : 'Budget left after spending', '', s.remaining < 0 ? '--overdue' : '--paid')}

        ${kpi('Expected Income', s.expectedIncome, 'Planned for this month')}

      </div>

      <div class="grid-3-1">
        <div class="card">
          <div class="card-head"><h3 class="card-title">Budget Health</h3><span class="health ${healthCls}">${U.esc(b.health)}</span></div>
          <div class="card-pad" style="padding-top:8px">
            <div class="meter" aria-label="Budget used ${Math.round(b.percentUsed)}%"><div class="fill" style="width:${pct}%"></div>${b.basis > 0 ? `<div class="proj" style="left:${proj}%" data-tip="Projected if every scheduled bill is paid: ${U.esc(U.peso(b.projectedSpend))}"></div>` : ''}</div>
            <div class="meter-legend"><span><b>${U.peso(b.totalSpent, true)}</b> spent · ${Math.round(b.percentUsed)}% of ${U.peso(b.basis, true)}</span><span><span style="display:inline-block;width:10px;height:2px;background:var(--gold);vertical-align:middle"></span> Projected ${U.peso(b.projectedSpend, true)}</span></div>
            ${b.reasons.length ? `<ul class="reasons">${b.reasons.map(r => `<li>${U.esc(r)}</li>`).join('')}</ul>` : `<p class="sub" style="color:var(--ink-2);margin:14px 0 0">Spending, projected bills and income are all within plan for ${U.esc(U.monthLabel(Store.month))}.</p>`}
            <div style="margin-top:22px"><div class="card-title" style="margin-bottom:10px">Bill Payment Status</div>${Charts.register('status', Charts.status(s.counts))}</div>
